# Ajout du bouton « Mes jeux » et du Mode Parent partage dans tous les outils - VERSION 1.0 (2026-11-07)
# Declenchement : quand hub-commun.js est modifie, ou a la main (onglet Actions > Run workflow)
name: Injecter hub-commun dans les outils

on:
  push:
    branches: [main, master]
    paths: ['hub-commun.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier-hub
  cancel-in-progress: false

jobs:
  injecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controle de hub-commun.js et injection
        run: python .github/scripts/injecter.py
      - name: Publier (commit et push)
        run: |
          git config user.name "hub-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a modifier."
          else
            git commit -F /tmp/commit_message.txt
            git pull --rebase
            git push
          fi
