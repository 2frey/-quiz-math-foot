# Publication automatique des outils du hub - VERSION 1.0 (2026-11-07)
# Declenchement : des qu'un fichier .html est depose dans le dossier a-publier/
name: Publier les outils

on:
  push:
    branches: [main, master]
    paths: ['a-publier/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier-hub
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controles et mise a jour du hub
        run: python .github/scripts/auto.py
      - name: Publier (commit et push)
        run: |
          git config user.name "hub-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a publier."
          else
            git commit -F /tmp/commit_message.txt
            git push
          fi
