<!DOCTYPE html>
<!--
  CHRONO DEVOIRS — Travaille malin, bats ton record !
  HISTORIQUE DES VERSIONS
  | Version | Date       | Modifications                                                                 |
  |---------|------------|-------------------------------------------------------------------------------|
  | 2.0     | 2026-10-03 | Synchronisation Firebase entre appareils : joueur choisi dans la liste de Quiz Math Foot,   |
  |         |            | séances et jeux enregistrés en ligne (une entrée = un document, sans conflit), récompense   |
  |         |            | et effacement réservés au parent (connexion email/mot de passe). Fonctionne hors ligne :    |
  |         |            | file d'attente locale puis envoi automatique. Sans Firebase : code local (v1.2) conservé.   |
  | 1.2     | 2026-10-03 | Mode Parent protégé par un code choisi par le parent (création au 1er accès, 👁️, changement,   |
  |         |            | blocage 30 s après 3 erreurs, « code oublié » = effacement des données) ; fin du calcul 17 × 6 |
  | 1.1     | 2026-10-03 | Astuces pendant les exercices : mémo permanent (méthode + mots-clés pour les maths),        |
  |         |            | astuces propres à la matière dans le chrono, bouton « Toutes les astuces » (chrono non coupé)|
  | 1.0     | 2026-10-03 | Création : chrono par matière + type (exercices / leçon), défi temps,         |
  |         |            | historique (tableau + graphique 7 jours), points / niveaux / badges,           |
  |         |            | récompense choisie par le parent, astuces de méthode, jeu « Énoncés en        |
  |         |            | 5 étapes » (nombres, mots-clés, opération, calcul, phrase-réponse), Mode Parent|

  NOTES TECHNIQUES
  - Un seul fichier, aucune dépendance : fonctionne en ligne (GitHub Pages) et hors ligne.
  - Données enregistrées dans le navigateur (localStorage) : propres à chaque appareil.
  - Aucun alert()/confirm() : fenêtres et messages maison. Aucun glisser-déposer : tout se fait au toucher.
  - Lien « Accueil » relatif : ce fichier doit être à la racine du dépôt, à côté de index.html.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chrono Devoirs — Bats ton record !</title>
<style>
  :root{
    --fond1:#FFF7E6; --fond2:#E8F4FF; --texte:#1F2340; --doux:#5B6280; --blanc:#fff;
    --ombre:0 5px 0 rgba(31,35,64,.12), 0 9px 20px rgba(31,35,64,.10);
    --vert:#2EAD5B; --vert-c:#E3F7EA; --indigo:#4B45D6; --indigo-c:#ECEBFF;
    --orange:#FF8A1F; --orange-c:#FFF0E0; --bleu:#1E88E5; --bleu-c:#E3F1FD;
    --violet:#8B3FE0; --violet-c:#F3EAFF; --jaune:#FFC93C; --rose-c:#FDEAEA; --rose:#D96A6A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:"Segoe UI","Trebuchet MS",Verdana,Arial,sans-serif; color:var(--texte); font-size:17px;
    background:radial-gradient(circle at 10% 5%,rgba(255,201,60,.35),transparent 40%),
               radial-gradient(circle at 90% 95%,rgba(75,69,214,.18),transparent 45%),
               linear-gradient(160deg,var(--fond1),var(--fond2));
    min-height:100vh; padding:14px 12px 40px; -webkit-tap-highlight-color:transparent;
  }
  .page{max-width:920px;margin:0 auto;}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
  a.accueil{display:inline-block;color:var(--indigo);font-weight:700;text-decoration:none;font-size:15px;margin-bottom:6px;}

  /* En-tête */
  .top{background:var(--blanc);border-radius:22px;box-shadow:var(--ombre);padding:12px 16px;margin-bottom:14px;
       display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .logo{font-size:40px;line-height:1;animation:rebond 2.4s ease-in-out infinite;}
  @keyframes rebond{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-6px) rotate(4deg);}}
  .top h1{margin:0;font-size:clamp(22px,5vw,30px);font-weight:900;
          background:linear-gradient(90deg,var(--orange),var(--violet),var(--bleu));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .sous{font-size:14px;color:var(--doux);}
  .score{margin-left:auto;text-align:right;min-width:190px;flex:1 1 190px;}
  .score .l1{font-weight:800;font-size:16px;}
  .xp{height:12px;background:#E6E8F2;border-radius:8px;overflow:hidden;margin:5px 0 2px;}
  .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--jaune),var(--orange));border-radius:8px;transition:width .5s;}
  .score .l2{font-size:13px;color:var(--doux);}

  /* Onglets */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  @media(min-width:640px){.tabs{grid-template-columns:repeat(6,1fr);}}
  .tab{background:var(--blanc);border:3px solid transparent;border-radius:16px;padding:9px 4px;font-weight:800;font-size:14px;
       box-shadow:0 3px 0 rgba(31,35,64,.12);text-align:center;line-height:1.2;}
  .tab .ic{display:block;font-size:24px;}
  .tab.on{border-color:var(--indigo);background:var(--indigo-c);}
  .panel{display:none;} .panel.on{display:block;}

  /* Cartes */
  .card{background:var(--blanc);border-radius:20px;box-shadow:var(--ombre);padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 4px;font-size:20px;} .card h3{margin:14px 0 6px;font-size:17px;}
  .etape{display:inline-block;background:var(--indigo);color:#fff;border-radius:20px;padding:2px 12px;font-weight:800;font-size:15px;margin-bottom:6px;}
  .consigne{background:#FFFBEA;border:3px dashed var(--jaune);border-radius:16px;padding:10px 14px;font-weight:800;margin:8px 0 12px;}
  .doux{color:var(--doux);font-size:15px;}

  /* Puces / boutons */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .chip{background:#F4F5FB;border:3px solid #E1E4F2;border-radius:30px;padding:9px 14px;font-weight:700;min-height:46px;}
  .chip.on{background:var(--vert-c);border-color:var(--vert);}
  .btn{display:inline-block;border:none;border-radius:18px;padding:13px 22px;font-weight:900;font-size:18px;color:#fff;
       background:var(--indigo);box-shadow:0 5px 0 #3631A8;min-height:50px;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3631A8;}
  .btn.vert{background:var(--vert);box-shadow:0 5px 0 #1F8545;} .btn.vert:active{box-shadow:0 2px 0 #1F8545;}
  .btn.orange{background:var(--orange);box-shadow:0 5px 0 #C76A10;} .btn.orange:active{box-shadow:0 2px 0 #C76A10;}
  .btn.gris{background:#8A90AA;box-shadow:0 5px 0 #646A84;} .btn.gris:active{box-shadow:0 2px 0 #646A84;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;}

  /* Chrono */
  .big{font-size:clamp(54px,16vw,96px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--indigo);line-height:1.1;}
  .big.pause{color:var(--doux);}
  .bar{height:20px;background:#E6E8F2;border-radius:12px;overflow:hidden;margin:6px 0;}
  .bar i{display:block;height:100%;width:0;background:var(--vert);border-radius:12px;transition:width .3s,background .3s;}
  .bar i.chaud{background:var(--orange);} .bar i.depasse{background:var(--violet);}
  .centre{text-align:center;}
  .astuce{background:var(--bleu-c);border-left:6px solid var(--bleu);border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;}
  details.memo{background:#EAF3FD;border:3px solid var(--bleu);border-radius:16px;padding:10px 14px;margin-top:12px;text-align:left;}
  details.memo summary{font-weight:900;cursor:pointer;font-size:17px;}
  details.memo ul{margin:8px 0 0;padding-left:20px;} details.memo li{margin:4px 0;font-weight:600;font-size:16px;}
  .info{background:var(--vert-c);border-radius:12px;padding:9px 13px;margin-top:10px;font-weight:600;font-size:16px;}

  /* Tableaux */
  .tw{overflow:auto;max-height:380px;border:2px solid #E1E4F2;border-radius:14px;}
  table{border-collapse:collapse;width:100%;font-size:15px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #ECEEF7;white-space:nowrap;}
  td.wrap,th.wrap{white-space:normal;}
  th{position:sticky;top:0;background:var(--indigo-c);z-index:1;font-size:14px;}
  tr:nth-child(even) td{background:#FAFAFE;}
  .mots td:first-child{font-weight:800;white-space:normal;}
  .pill{display:inline-block;border-radius:20px;padding:1px 10px;font-weight:800;font-size:14px;}
  .pill.ok{background:var(--vert-c);color:#1F7A41;} .pill.no{background:var(--orange-c);color:#B35A00;}

  /* Graphique 7 jours */
  .graph{display:flex;align-items:flex-end;gap:8px;height:150px;padding:6px 4px 0;}
  .graph div{flex:1;text-align:center;font-size:12px;color:var(--doux);display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
  .graph b{display:block;background:linear-gradient(180deg,var(--bleu),var(--indigo));border-radius:8px 8px 0 0;min-height:0;}
  .graph span{font-weight:800;color:var(--texte);}

  /* Badges */
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .badge{border-radius:16px;padding:10px;text-align:center;background:#F1F2F8;border:3px solid #E1E4F2;}
  .badge .e{font-size:34px;filter:grayscale(1);opacity:.45;} .badge .n{font-weight:800;font-size:15px;} .badge .d{font-size:13px;color:var(--doux);}
  .badge.got{background:#FFF8DC;border-color:var(--jaune);} .badge.got .e{filter:none;opacity:1;}

  /* Jeu énoncés */
  .enonce{background:#FFFDF5;border:3px solid #F1E3B5;border-radius:16px;padding:14px;font-size:20px;line-height:2.1;}
  .tok{border-radius:8px;padding:2px 4px;cursor:pointer;border:2px solid transparent;}
  .tok.sel{background:var(--bleu-c);border-color:var(--bleu);}
  .tok.ok{background:#CDF0D8;border-color:var(--vert);} .tok.manque{border:2px dashed var(--orange);background:var(--orange-c);}
  .tok.faux{background:var(--rose-c);border-color:var(--rose);}
  .tok.n{background:var(--bleu-c);border-color:var(--bleu);font-weight:800;} .tok.k{background:#FFF0B8;border-color:var(--jaune);font-weight:800;}
  .ops{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:560px){.ops{grid-template-columns:repeat(4,1fr);}}
  .op{background:#F4F5FB;border:3px solid #E1E4F2;border-radius:16px;padding:12px 6px;font-weight:800;text-align:center;font-size:16px;}
  .op .s{display:block;font-size:34px;line-height:1.1;}
  .op.on{border-color:var(--indigo);background:var(--indigo-c);}
  .rep{display:block;width:100%;text-align:left;background:#F4F5FB;border:3px solid #E1E4F2;border-radius:14px;padding:12px;margin:8px 0;font-weight:700;}
  .rep.on{border-color:var(--indigo);background:var(--indigo-c);}
  input[type=text],input[type=number],input[type=password],input[type=email]{font-family:inherit;font-size:20px;padding:10px 12px;border:3px solid #CBD0E6;border-radius:14px;width:150px;}
  input.large{width:100%;max-width:320px;}
  .oeil{background:#F4F5FB;border:3px solid #CBD0E6;border-radius:14px;padding:8px 12px;font-size:20px;min-height:48px;}
  .calc{font-size:34px;font-weight:900;text-align:center;margin:10px 0;color:var(--indigo);}
  .fb{border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:700;}
  .fb.ok{background:var(--vert-c);border:2px solid var(--vert);} .fb.indice{background:var(--orange-c);border:2px solid var(--orange);}
  .fb.corrige{background:var(--violet-c);border:2px solid var(--violet);}
  .dots{display:flex;gap:6px;margin:6px 0 8px;} .dots i{flex:1;height:10px;border-radius:6px;background:#E1E4F2;} .dots i.fait{background:var(--vert);} .dots i.now{background:var(--jaune);}
  .liste-pb{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .pb{background:#F4F5FB;border:3px solid #E1E4F2;border-radius:16px;padding:12px;text-align:left;font-weight:800;}
  .pb.fait{background:var(--vert-c);border-color:var(--vert);}

  /* Fenêtre + message */
  #fond{position:fixed;inset:0;background:rgba(31,35,64,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:50;}
  #fond.on{display:flex;}
  #modal{background:#fff;border-radius:22px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--ombre);}
  #modal h2{margin:0 0 8px;}
  .check{display:flex;gap:10px;align-items:center;background:#F4F5FB;border:3px solid #E1E4F2;border-radius:14px;padding:11px;margin:8px 0;font-weight:700;}
  .check .b{width:28px;height:28px;border-radius:8px;border:3px solid #AAB0CC;background:#fff;flex:none;text-align:center;line-height:22px;font-weight:900;color:#fff;}
  .check.on{border-color:var(--vert);background:var(--vert-c);} .check.on .b{background:var(--vert);border-color:var(--vert);}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--texte);color:#fff;border-radius:30px;padding:11px 20px;
         font-weight:700;opacity:0;transition:all .3s;z-index:60;max-width:92vw;text-align:center;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{text-align:center;color:var(--doux);font-size:13px;margin-top:18px;}
  label.f{display:block;font-weight:800;margin:10px 0 4px;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media print{
    body{background:#fff;padding:0;} .tabs,.top .logo,a.accueil,.noprint,#fond,#toast,.btn{display:none!important;}
    .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid;} .tw{max-height:none;overflow:visible;}
  }
</style>
</head>
<body>
<div class="page">
  <a class="accueil" href="index.html">🏠 Accueil</a>

  <header class="top">
    <div class="logo">⏱️</div>
    <div>
      <h1>Chrono Devoirs</h1>
      <div class="sous">Travaille malin, bats ton record !</div>
    </div>
    <div class="score" aria-live="polite">
      <div class="l1" id="hNiveau">Niveau 1 · Apprenti</div>
      <div class="xp"><i id="hXp" style="width:0%"></i></div>
      <div class="l2" id="hPts">0 point · 🔥 0 jour</div>
      <div class="l2" id="hSync"></div>
    </div>
  </header>

  <nav class="tabs noprint" aria-label="Menu">
    <button class="tab on" data-tab="chrono"><span class="ic">⏱️</span>Chrono</button>
    <button class="tab" data-tab="histo"><span class="ic">📊</span>Historique</button>
    <button class="tab" data-tab="astuces"><span class="ic">💡</span>Astuces</button>
    <button class="tab" data-tab="enonces"><span class="ic">🔍</span>Énoncés</button>
    <button class="tab" data-tab="trophees"><span class="ic">🏆</span>Trophées</button>
    <button class="tab" data-tab="parent"><span class="ic">👪</span>Mode Parent</button>
  </nav>

  <section class="panel on" id="p-chrono"></section>
  <section class="panel" id="p-histo"></section>
  <section class="panel" id="p-astuces"></section>
  <section class="panel" id="p-enonces"></section>
  <section class="panel" id="p-trophees"></section>
  <section class="panel" id="p-parent"></section>

  <footer>Chrono Devoirs · v2.0 · 03/10/2026 · Synchronisé entre appareils quand la connexion le permet.</footer>
</div>

<div id="fond"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
"use strict";
/* ============================ DONNÉES DE BASE ============================ */
var VERSION='2.0';
var KEY='chronoDevoirs_v2';
var MATIERES=[
  {id:'maths',n:'Maths',e:'🧮'},{id:'francais',n:'Français',e:'📚'},{id:'lecture',n:'Lecture',e:'📖'},
  {id:'histgeo',n:'Histoire-Géo',e:'🌍'},{id:'sciences',n:'Sciences',e:'🔬'},{id:'anglais',n:'Anglais',e:'🇬🇧'},{id:'autre',n:'Autre',e:'⭐'}
];
var TYPES=[{id:'exo',n:'Exercices',e:'✏️'},{id:'lecon',n:'Apprendre la leçon',e:'🧠'}];
var DEFIS=[10,15,20,30,45,0];
var NIVEAUX=['Apprenti','Explorateur','Aventurier','Champion','Super-Champion','Maître','Légende'];
var CHECKS={
  exo:['J\u2019ai lu chaque consigne en entier','Je me suis relu(e) et j\u2019ai vérifié','Mon travail est soigné et lisible'],
  lecon:['Je sais la dire sans regarder','Je me suis testé(e) (à voix haute ou par écrit)','Je pourrais l\u2019expliquer à quelqu\u2019un']
};

/* ============================ STOCKAGE ============================ */
/* P = ce qui est enregistré sur l'appareil (cache + file d'attente d'envoi).
   S = vue calculée pour le joueur affiché (séances, points, badges…) : recalculée par recompute(). */
var mem=null;
var LOCAL='@appareil';
function defaultsP(){return {joueur:'',roster:[],cache:{},run:null,code:{salt:'',hash:''}};}
function loadP(){
  var d=defaultsP();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);
      if(o&&typeof o==='object'){
        d.joueur=String(o.joueur||'');d.roster=Array.isArray(o.roster)?o.roster:[];
        if(o.cache&&typeof o.cache==='object')d.cache=o.cache;
        d.run=o.run&&o.run.m?o.run:null;
        if(o.code){d.code.salt=String(o.code.salt||'');d.code.hash=String(o.code.hash||'');}
      }}
  }catch(e){ if(mem) d=mem; }
  return d;
}
var P=loadP();
var S={sessions:[],points:0,badges:[],jeu:{faits:[],sansFaute:0},parent:{recompense:'',cible:200,salt:'',hash:''},run:P.run};
function fiche(nom){var c=P.cache[nom];if(!c)c=P.cache[nom]={sessions:[],jeux:[],reglages:{recompense:'',cible:200}};return c;}
function recompute(){
  var c=P.joueur?fiche(P.joueur):{sessions:[],jeux:[],reglages:{recompense:'',cible:200}};
  S.sessions=c.sessions.slice();
  var pts=0,faits=[],sf=0;
  S.sessions.forEach(function(x){pts+=(+x.pts||0);});
  c.jeux.forEach(function(j){pts+=(+j.gain||0);if(faits.indexOf(j.pid)<0)faits.push(j.pid);if(j.sf)sf++;});
  S.points=pts;S.jeu={faits:faits,sansFaute:sf};
  S.parent.recompense=String(c.reglages.recompense||'');S.parent.cible=+c.reglages.cible||200;
  S.parent.salt=P.code.salt;S.parent.hash=P.code.hash;
  S.badges=BADGES.filter(function(b){return b.f();}).map(function(b){return b.id;});
}
function save(){ P.run=S.run; mem=P; try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){} }
function nouvelId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function ajouterSeance(x){
  if(!P.joueur)return;
  x.pending=(P.joueur!==LOCAL);fiche(P.joueur).sessions.push(x);save();recompute();pousserEnAttente();
}
function ajouterJeu(j){
  if(!P.joueur)return;
  j.pending=(P.joueur!==LOCAL);fiche(P.joueur).jeux.push(j);save();recompute();pousserEnAttente();
}
function nouveauxBadges(avant){return BADGES.filter(function(b){return S.badges.indexOf(b.id)>=0&&avant.indexOf(b.id)<0;});}

/* ============================ OUTILS ============================ */
function $(id){return document.getElementById(id);}
function p2(n){return (n<10?'0':'')+n;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mat(id){for(var i=0;i<MATIERES.length;i++)if(MATIERES[i].id===id)return MATIERES[i];return MATIERES[6];}
function typ(id){return id==='lecon'?TYPES[1]:TYPES[0];}
function clock(ms){var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return (h>0?h+':'+p2(m):p2(m))+':'+p2(s);}
function dur(sec){sec=Math.round(sec);if(sec<60)return sec+' s';var m=Math.floor(sec/60),s=sec%60;return m+' min'+(s?' '+s+' s':'');}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function streak(){
  var set={};S.sessions.forEach(function(s){set[dayKey(s.ts)]=1;});
  var d=new Date();d.setHours(12,0,0,0);
  if(!set[dayKey(d)])d.setDate(d.getDate()-1);
  var n=0;while(set[dayKey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function statsFor(m,t){
  var a=S.sessions.filter(function(s){return s.m===m&&s.t===t;});

}

function parseTxt(txt){
  return txt.split(' ').map(function(w){
    var m=w.match(/^\*(.+?)\*(.*)$/);if(m)return{t:m[1],s:m[2],k:true,n:false};
    m=w.match(/^(\d+)(.*)$/);if(m)return{t:m[1],s:m[2],k:false,n:true};
    return{t:w,s:'',k:false,n:false};
  });
}

function lancerPb(i){
  var p=PROBS[i],seq=[{t:'nombres'},{t:'mots'}];

  seq.push({t:'phrase'});
  var ph=p.ph.map(function(t,k){return{t:t,ok:k===0};});
  for(var a=ph.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1)),x=ph[a];ph[a]=ph[b];ph[b]=x;}
  G={i:i,toks:parseTxt(p.txt),seq:seq,pos:0,sel:{},err:0,errTot:0,fb:null,verrou:false,choix:null,phr:ph,fini:false,gain:0,nouveaux:[]};
  renderJeu();
}
function tapTok(i){if(!G||G.verrou)return;G.sel[i]=!G.sel[i];G.fb=null;renderJeu();}
function echec(indice,corrige){
  if(G.verrou)return;

function validerSel(){

  G.toks.forEach(function(k,i){var exp=(cur.t==='nombres')?k.n:k.k;if(exp)nb++;if(!!G.sel[i]!==exp)ok=false;});
  if(ok){reussite(cur.t==='nombres'?'Bravo, tu as trouvé les '+nb+' nombres !':'Bravo, tu as trouvé les '+nb+' mots-clés !');return;}
  if(cur.t==='nombres')echec('Il y a '+nb+' nombres. Cherche les chiffres dans l\u2019énoncé.','les nombres sont marqués en vert ; ceux qui manquent sont entourés en orange.');
  else echec('Il y a '+nb+' mots-clés. Cherche les verbes qui disent ce qui se passe, et les mots comme « en tout », « reste », « chaque ».','les mots-clés sont marqués en vert ; ceux qui manquent sont entourés en orange.');

  var debut=new Date();debut.setHours(0,0,0,0);debut.setDate(debut.getDate()-6);
  var sem=S.sessions.filter(function(s){return s.ts>=debut.getTime();});
  var tot=sem.reduce(function(x,s){return x+s.d;},0),par={};
  sem.forEach(function(s){par[s.m]=(par[s.m]||0)+s.d;});
  var h='<div class="card"><h2>👤 Joueur affiché</h2><div class="chips">';
  P.roster.forEach(function(n,i){h+='<button class="chip'+(P.joueur===n?' on':'')+'" onclick="choisirJoueurIdx('+i+')">'+esc(n)+'</button>';});
  if(P.joueur===LOCAL)h+='<button class="chip on">Cet appareil</button>';
  h+='</div><div class="doux">'+(P.joueur?esc(nomAff(P.joueur))+' · ':'Aucun joueur choisi · ')+(firebaseOK?'🟢 synchronisé':(db?'🔴 hors ligne : les données seront envoyées au retour du réseau':'⚪ sans synchronisation'))+'</div></div>';
  h+='<div class="card"><h2>📅 Résumé des 7 derniers jours</h2>';
  if(!sem.length)h+='<p class="doux">Aucune séance cette semaine.</p>';
  else{
    var jours={};sem.forEach(function(s){jours[dayKey(s.ts)]=1;});
    h+='<p><b>'+sem.length+'</b> séance'+(sem.length>1?'s':'')+' sur <b>'+Object.keys(jours).length+'</b> jour'+(Object.keys(jours).length>1?'s':'')+' · temps total <b>'+dur(tot)+'</b></p><div class="tw" style="max-height:none"><table><tr><th>Matière</th><th>Temps</th></tr>';
    Object.keys(par).sort(function(a,b){return par[b]-par[a];}).forEach(function(k){h+='<tr><td>'+mat(k).e+' '+mat(k).n+'</td><td>'+dur(par[k])+'</td></tr>';});
    h+='</table></div>';
  }
  h+='<div class="astuce">💬 Conseil : félicitez l\u2019effort et le soin autant que la vitesse. Un joueur qui bâcle pour battre son record ne progresse pas : demandez-lui de vous montrer son travail relu.</div></div>';
  h+='<div class="card"><h2>🎁 Récompense du joueur</h2><label class="f" for="rTxt">Récompense proposée</label><input type="text" id="rTxt" class="large" style="width:100%;max-width:420px" maxlength="80" placeholder="Ex. : une soirée film en famille" value="'+esc(S.parent.recompense)+'">'
   +'<label class="f" for="rPts">Points à atteindre</label><input type="number" id="rPts" inputmode="numeric" min="50" step="50" value="'+S.parent.cible+'">'
   +'<div class="row"><button class="btn vert" onclick="saveRecompense()">Enregistrer</button></div></div>';
  h+='<div class="card"><h2>🗂️ Données</h2><div class="row"><button class="btn" onclick="exportCsv()">⬇️ Télécharger l\u2019historique (CSV)</button>'+(firebaseOK?'':'<button class="btn" onclick="demanderChangeCode()">🔐 Changer le code</button>')+'<button class="btn orange" onclick="demanderReset()">🗑️ Effacer les données de ce joueur</button><button class="btn gris" onclick="quitterParent()">🔒 Quitter le Mode Parent</button></div></div>';
  el.innerHTML=h;
}
/* --- Code parent (v1.2) --- */
var essais=0,verrouJusqua=0;
function cyrb53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function genSalt(){var a='';for(var i=0;i<12;i++)a+=Math.floor(Math.random()*36).toString(36);return a;}
function hashCode(code,salt){return cyrb53('chrono|'+salt+'|'+code);}
function codeJuste(c){return !!S.parent.hash&&hashCode(c,S.parent.salt)===S.parent.hash;}
function codeValide(c){return typeof c==='string'&&c.length>=4&&c.length<=12;}
function voirMdp(id){var c=$(id);if(c)c.type=(c.type==='password'?'text':'password');}
function champMdp(id,ph,enter){return '<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin:6px 0"><input type="password" id="'+id+'" class="large" placeholder="'+ph+'" autocomplete="off" maxlength="12"'+(enter?' onkeydown="if(event.key===\'Enter\')'+enter+'"':'')+'><button type="button" class="oeil" onclick="voirMdp(\''+id+'\')" aria-label="Afficher ou masquer le code">👁️</button></div>';}
function formCreation(){
  return '<div class="card centre"><div style="font-size:46px">👪</div><h2>Mode Parent : créez votre code</h2>'
   +'<p class="doux">Choisissez un code de 4 à 12 caractères (lettres ou chiffres). Il sera demandé à chaque entrée dans le Mode Parent. Notez-le : il ne peut pas être retrouvé.</p>'
   +champMdp('cNew','Votre code',null)+champMdp('cNew2','Confirmez le code','creerCode()')
   +'<button class="btn" onclick="creerCode()">Enregistrer mon code</button><div id="gateMsg" class="doux" style="margin-top:8px;font-weight:700"></div></div>';
}
function formEntree(){
  return '<div class="card centre"><div style="font-size:46px">👪</div><h2>Mode Parent</h2><p class="doux">Espace réservé aux adultes. Entrez votre code.</p>'
   +champMdp('gate','Code parent','entrerParent()')+'<button class="btn" onclick="entrerParent()">Entrer</button>'
   +'<div id="gateMsg" class="doux" style="margin-top:8px;font-weight:700"></div>'
   +'<div style="margin-top:10px"><button class="chip" onclick="codeOublie()">Code oublié ?</button></div></div>';
}
function creerCode(){
  var a=$('cNew').value,b=$('cNew2').value,m=$('gateMsg');
  if(!codeValide(a)){m.textContent='Le code doit contenir entre 4 et 12 caractères.';return;}
  if(a!==b){m.textContent='Les deux codes ne sont pas identiques.';return;}
  P.code.salt=genSalt();P.code.hash=hashCode(a,P.code.salt);S.parent.salt=P.code.salt;S.parent.hash=P.code.hash;save();parentOK=true;essais=0;toast('✅ Code enregistré');renderParent();
}
function entrerParent(){
  var m=$('gateMsg'),now=Date.now();
  if(now<verrouJusqua){m.textContent='Trop d\u2019essais. Patientez '+Math.ceil((verrouJusqua-now)/1000)+' s.';return;}
  if(codeJuste($('gate').value)){parentOK=true;essais=0;renderParent();return;}
  essais++;
  if(essais>=3){verrouJusqua=now+30000;essais=0;m.textContent='Code incorrect. Nouvel essai possible dans 30 s.';}
  else m.textContent='Code incorrect. Ce mode est réservé aux parents 😉';
}
function codeOublie(){
  openModal('<h2>Code oublié ?</h2><p>Le code ne peut pas être retrouvé. Pour en créer un nouveau, il faut <b>effacer toutes les données</b> de cet appareil (historique, points, badges).</p><div class="row"><button class="btn gris" onclick="closeModal()">Non, retour</button><button class="btn orange" onclick="reset()">Oui, tout effacer</button></div>');
}
function demanderChangeCode(){
  openModal('<h2>🔐 Changer le code</h2>'+champMdp('cOld','Code actuel',null)+champMdp('cNew','Nouveau code',null)+champMdp('cNew2','Confirmez le nouveau code','changerCode()')
   +'<div id="cMsg" class="doux" style="font-weight:700;min-height:22px"></div><div class="row"><button class="btn vert" onclick="changerCode()">Enregistrer</button><button class="btn gris" onclick="closeModal()">Annuler</button></div>');
}
function changerCode(){
  var o=$('cOld').value,a=$('cNew').value,b=$('cNew2').value,m=$('cMsg');
  if(!codeJuste(o)){m.textContent='Le code actuel est incorrect.';return;}
  if(!codeValide(a)){m.textContent='Le nouveau code doit contenir entre 4 et 12 caractères.';return;}
  if(a!==b){m.textContent='Les deux nouveaux codes ne sont pas identiques.';return;}
  P.code.salt=genSalt();P.code.hash=hashCode(a,P.code.salt);S.parent.salt=P.code.salt;S.parent.hash=P.code.hash;save();closeModal();toast('✅ Code modifié');
}
function saveRecompense(){
  if(!P.joueur){toast('Choisissez d\u2019abord un joueur');return;}
  var c=parseInt($('rPts').value,10);if(!(c>=50))c=200;
  var txt=$('rTxt').value.trim().slice(0,80),nom=P.joueur;
  var fin=function(){fiche(nom).reglages={recompense:txt,cible:c};save();recompute();toast('✅ Récompense enregistrée');renderParent();};
  if(firebaseOK&&nom!==LOCAL){
    if(!parentConnecte()){toast('Connexion parent requise');return;}
    refDoc(nom).set({recompense:txt,cible:c},{merge:true}).then(fin).catch(function(){toast('Enregistrement impossible pour le moment');});
  }else fin();
}
function exportCsv(){
  var L=['Date;Heure;Matière;Type;Durée (s);Défi (min);Défi réussi;Auto-contrôles;Points'];
  S.sessions.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(s){
    var d=new Date(s.ts);
    L.push([p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear(),p2(d.getHours())+':'+p2(d.getMinutes()),mat(s.m).n,typ(s.t).n,s.d,s.defi||'',s.defiOk?'oui':'non',s.checks,s.pts].join(';'));
  });
  try{
    var b=new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='historique-chrono-devoirs'+(P.joueur&&P.joueur!==LOCAL?'-'+P.joueur.replace(/[^A-Za-z0-9À-ÿ_-]/g,'_'):'')+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
    toast('⬇️ Fichier téléchargé');
  }catch(e){toast('Téléchargement impossible sur cet appareil');}
}
function demanderReset(){
  var n=P.joueur?nomAff(P.joueur):'ce joueur';
  openModal('<h2>Tout effacer ?</h2><p>L\u2019historique, les points et les badges de <b>'+esc(n)+'</b> seront supprimés '+((firebaseOK&&P.joueur!==LOCAL)?'<b>sur tous les appareils</b>':'sur cet appareil')+'. Cette action est définitive.</p><div class="row"><button class="btn gris" onclick="closeModal()">Non, garder</button><button class="btn orange" onclick="effacerJoueur()">Oui, tout effacer</button></div>');
}
function effacerJoueur(){
  var nom=P.joueur;
  var fin=function(){if(nom)delete P.cache[nom];save();recompute();closeModal();toast('Données effacées');rafraichir();};
  if(firebaseOK&&nom&&nom!==LOCAL){
    if(!parentConnecte()){closeModal();toast('Connexion parent requise');return;}
    supprimerServeur(nom).then(fin).catch(function(){closeModal();toast('Suppression impossible pour le moment');});
  }else fin();
}
/* Réinitialisation locale complète (code oublié) : le serveur restaure ensuite les données du joueur. */
function reset(){
  P=defaultsP();S.run=null;parentOK=false;desabonner();save();recompute();closeModal();sel={m:null,t:null,defi:0};G=null;
  if(firebaseOK)ecouterRoster();
  updateHeader();toast('Données de l\u2019appareil effacées');showTab(tabCourant);
}

/* ============================ SYNCHRONISATION FIREBASE (v2.0) ============================ */
/* Même projet Firebase que Quiz Math Foot. Cette configuration n'est pas secrète : la protection des
   données repose sur les règles Firestore (côté serveur). Aucune adresse email n'est écrite ici. */
var firebaseConfig={
  apiKey:"AIzaSyAP8dleVoF3ejPe4R4Q5ef8HpY1QQSIwtg",
  authDomain:"quizz-multiplication.firebaseapp.com",
  projectId:"quizz-multiplication",
  storageBucket:"quizz-multiplication.firebasestorage.app",
  messagingSenderId:"869707235327",
  appId:"1:869707235327:web:cc122791ba8727687a71ca"
};
var db=null,firebaseOK=false,unsubs=[],unsubRoster=null,enVol={};
try{ if(typeof firebase!=='undefined'){ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); } }catch(e){ db=null; }
function nomDoc(n){return String(n).replace(/\//g,'_').trim();}
function refDoc(nom){return db.collection('chrono').doc(nomDoc(nom));}
function nomAff(n){return n===LOCAL?'Cet appareil':n;}
function majStatut(){
  var el=$('hSync');if(!el)return;
  var j=P.joueur?('👤 '+nomAff(P.joueur)+' · '):'';
  el.textContent=j+((P.joueur===LOCAL)?'⚪ cet appareil':(firebaseOK?'🟢 en ligne':(db?'🔴 hors ligne':'⚪ sans synchronisation')));
}
function parentConnecte(){return !!(firebaseOK&&firebase.auth().currentUser&&!firebase.auth().currentUser.isAnonymous);}
function desabonner(){unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];}
function rafraichir(){
  updateHeader();
  if($('fond').className==='on')return;
  var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;
  if(tabCourant==='histo')renderHisto(); else if(tabCourant==='trophees')renderTrophees(); else if(tabCourant==='parent')renderParent();
  else if(tabCourant==='chrono'&&!S.run)renderChrono(); else if(tabCourant==='enonces'&&!G)renderJeu();
}
function apresSync(nom){ if(nom!==P.joueur)return; save();recompute();rafraichir(); }
function fusion(nom,cle,snap){
  var c=fiche(nom),serveur=[],ids={};
  snap.forEach(function(d){var o=d.data();o.id=d.id;serveur.push(o);ids[d.id]=1;});
  var locaux=c[cle].filter(function(x){return x.pending&&!ids[x.id];});
  c[cle]=serveur.concat(locaux);
  apresSync(nom);
}
function ecouter(nom){
  desabonner();
  if(!firebaseOK||!nom||nom===LOCAL)return;
  var base=refDoc(nom),err=function(){};
  unsubs.push(base.collection('seances').onSnapshot(function(snap){fusion(nom,'sessions',snap);},err));
  unsubs.push(base.collection('jeux').onSnapshot(function(snap){fusion(nom,'jeux',snap);},err));
  unsubs.push(base.onSnapshot(function(doc){var d=doc.exists?doc.data():{};fiche(nom).reglages={recompense:String(d.recompense||''),cible:+d.cible||200};apresSync(nom);},err));
}
function ecouterRoster(){
  if(!firebaseOK)return;
  if(unsubRoster){try{unsubRoster();}catch(e){}}
  unsubRoster=db.collection('classe').doc('liste').onSnapshot(function(doc){
    P.roster=(doc.exists&&Array.isArray(doc.data().noms))?doc.data().noms:[];save();rafraichir();
  },function(){});
}
function pousserEnAttente(){
  if(!firebaseOK||!db)return;
  Object.keys(P.cache).forEach(function(nom){
    if(nom===LOCAL)return;
    var c=P.cache[nom];
    c.sessions.forEach(function(x){
      var k=nom+'|s|'+x.id;if(!x.pending||enVol[k])return;enVol[k]=1;
      refDoc(nom).collection('seances').doc(String(x.id)).set({ts:x.ts,m:x.m,t:x.t,d:x.d,defi:x.defi||0,defiOk:!!x.defiOk,checks:x.checks||0,pts:x.pts||0,record:!!x.record})
        .then(function(){x.pending=false;delete enVol[k];save();}).catch(function(){delete enVol[k];});
    });
    c.jeux.forEach(function(j){
      var k=nom+'|j|'+j.id;if(!j.pending||enVol[k])return;enVol[k]=1;
      refDoc(nom).collection('jeux').doc(String(j.id)).set({ts:j.ts,pid:j.pid,gain:j.gain||0,sf:!!j.sf})
        .then(function(){j.pending=false;delete enVol[k];save();}).catch(function(){delete enVol[k];});
    });
  });
}
function supprimerServeur(nom){
  var base=refDoc(nom);
  return Promise.all([base.collection('seances').get(),base.collection('jeux').get()]).then(function(r){
    var refs=[];r.forEach(function(snap){snap.forEach(function(d){refs.push(d.ref);});});
    refs.push(base);
    var lots=[];for(var i=0;i<refs.length;i+=400)lots.push(refs.slice(i,i+400));
    return lots.reduce(function(p,lot){return p.then(function(){var b=db.batch();lot.forEach(function(x){b.delete(x);});return b.commit();});},Promise.resolve());
  });
}
function relancerEcoutes(){ if(firebaseOK){ecouterRoster();ecouter(P.joueur);} }
function demarrerFirebase(){
  if(!db){majStatut();return;}
  firebase.auth().signInAnonymously().then(function(){
    firebaseOK=true;majStatut();ecouterRoster();ecouter(P.joueur);pousserEnAttente();rafraichir();
  }).catch(function(){firebaseOK=false;majStatut();});
}
try{
  window.addEventListener('online',function(){ if(db&&!firebaseOK)demarrerFirebase(); else pousserEnAttente(); });
  setInterval(pousserEnAttente,60000);
}catch(e){}

/* --- Choix du joueur --- */
function chooserHTML(){
  var h='<div class="card"><h2>👤 Qui travaille ?</h2><div class="doux">Touche ton prénom.</div><div class="chips">';
  P.roster.forEach(function(n,i){h+='<button class="chip" onclick="choisirJoueurIdx('+i+')">'+esc(n)+'</button>';});
  h+='</div>';
  if(!P.roster.length)h+='<div class="info">'+(db&&!firebaseOK?'🔴 Pas de connexion pour l\u2019instant. ':'')+'Aucun joueur dans la liste. Le parent peut ajouter les joueurs dans Quiz Math Foot (Mode Parent → Gérer les joueurs).</div>';
  h+='<div class="row"><button class="btn gris" onclick="choisirJoueur(LOCAL)">Continuer sans compte (cet appareil seulement)</button></div></div>';
  return h;
}
function choisirJoueurIdx(i){choisirJoueur(P.roster[i]);}
function choisirJoueur(nom){
  if(!nom)return;
  if(S.run){toast('Une séance est en cours sur cet appareil.');return;}
  P.joueur=nom;fiche(nom);save();recompute();ecouter(nom);pousserEnAttente();
  sel={m:null,t:null,defi:0};G=null;updateHeader();showTab(tabCourant);
}
function changerJoueur(){
  if(S.run)return;
  P.joueur='';desabonner();save();recompute();updateHeader();renderChrono();
}

/* --- Connexion parent (en ligne) --- */
function formConnexionParent(){
  return '<div class="card centre"><div style="font-size:46px">👪</div><h2>Mode Parent</h2><p class="doux">Connectez-vous avec le compte parent (le même que pour Quiz Math Foot).</p>'
   +'<div style="margin:6px 0"><input type="email" id="pEmail" class="large" placeholder="Email" autocomplete="username" style="width:100%;max-width:340px"></div>'
   +champMdp('pMdp','Mot de passe','connecterParent()')
   +'<button class="btn" onclick="connecterParent()">Se connecter</button><div id="gateMsg" class="doux" style="margin-top:8px;font-weight:700"></div></div>';
}
function connecterParent(){
  var m=$('gateMsg');
  if(!firebaseOK){m.textContent='Pas de connexion internet.';return;}
  var e=$('pEmail').value.trim(),p=$('pMdp').value;
  if(!e||!p){m.textContent='Renseignez l\u2019email et le mot de passe.';return;}
  m.textContent='Connexion…';
  firebase.auth().signInWithEmailAndPassword(e,p).then(function(){renderParent();}).catch(function(err){
    m.textContent=(err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'||err.code==='auth/user-not-found')?'Email ou mot de passe incorrect.':'Connexion impossible ('+err.code+').';
  });
}
function quitterParent(){
  parentOK=false;
  if(firebaseOK&&firebase.auth().currentUser&&!firebase.auth().currentUser.isAnonymous){
    firebase.auth().signOut().then(function(){return firebase.auth().signInAnonymously();}).then(function(){relancerEcoutes();renderParent();}).catch(function(){renderParent();});
  }else renderParent();
}

/* ============================ DÉMARRAGE ============================ */
recompute();updateHeader();renderChrono();demarrerFirebase();
</script>
