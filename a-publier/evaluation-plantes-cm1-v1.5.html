}
function actBtns(){return '<button class="btn" onclick="validate()">Valider</button>'+(parentOn()?'<button class="btn hint" onclick="showHint()">💡 Indice</button>':'');}
function nextBtn(){return '<button class="btn" onclick="nextQ()">'+(S.i<Q.length-1?'Suivant ➜':'Voir mon résultat 🏁')+'</button>';}

function optHTML(q,k,fn,round){
  var o=q.opts[k];var isSel=!!S.cur.set[k];
  if(q.type==='single')isSel=(S.cur.val===k);
  return '<div class="opt '+(round?'round ':'')+stateCls(isSel,o.ok)+'" onclick="'+fn+'('+k+')"><span class="box">'+boxTxt(isSel,o.ok)+'</span><span>'+o.t+'</span></div>';
}
function zoneHTML(q){
  var c=S.cur,h='',k;
  if(q.type==='vf'){
    h='<div class="qtext">'+q.text+'</div><div class="vf">';
    [true,false].forEach(function(v){
      var sel=(c.val===v);
      h+='<div class="opt '+stateCls(sel,v===q.answer)+'" onclick="pickVF('+v+')">'+(v?'Vrai':'Faux')+'</div>';
    });
    return h+'</div>';
  }
  if(q.type==='single'){
    h=q.text?'<div class="qtext">'+q.text+'</div>':'';
    S.order[S.i].forEach(function(k){h+=optHTML(q,k,'pickSingle',true);});
    return h;
  }
  if(q.type==='multi'){
    if(q.center)h+='<div class="center">'+q.center+'</div>';
    h+=q.bubbles?'<div class="bubs">':'';
    S.order[S.i].forEach(function(k){h+=optHTML(q,k,'toggleMulti',false);});
    return h+(q.bubbles?'</div>':'');
  }
  if(q.type==='fill'){
    h='<div class="fillp">';
    q.parts.forEach(function(p){
      if(typeof p==='number'){var w=Math.max(8,(q.show[p]||'').length+3);h+='<input class="blank" id="in'+p+'" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+w+'ch">';}
      else h+=p;
    });
    return h+'</div>';
  }
  if(q.type==='sort'){
    h='<div class="pool">';
    c.pool.forEach(function(k){h+='<div class="chip'+(c.picked===k?' picked':'')+'" onclick="pickChip('+k+')">'+q.items[k].t+'</div>';});
    if(!c.pool.length)h+='<span class="mini">Tous les mots sont rangés.</span>';
    h+='</div><div class="bins">';
    q.cats.forEach(function(cat){
      h+='<div class="bin '+cat.cls+(c.picked!==null?' target':'')+'" onclick="dropTo(\''+cat.id+'\')"><h4>'+cat.t+'</h4><div class="binitems">';
      c.bins[cat.id].forEach(function(k){
        var cl='';if(S.done)cl=(q.items[k].cat===cat.id)?' good':' soft';
        h+='<div class="chip'+cl+'" onclick="event.stopPropagation();backToPool('+k+')">'+q.items[k].t+'</div>';
      });
      h+='</div></div>';
    });
    return h+'</div>';
  }
  if(q.type==='text'){
    return '<textarea class="zt" id="zt" placeholder="Écris ta phrase ici…"></textarea>';
  }
  return '';
}
function redrawZone(){var q=Q[S.i];if(q.type==='fill'||q.type==='text')return;$('zone').innerHTML=fr(zoneHTML(q));}
function need(m){$('fb').innerHTML=fr('<div class="fb info">'+m+'</div>');}
function showHint(){var q=Q[S.i];S.indice=true;$('fb').innerHTML=fr('<div class="fb info">💡 '+q.hint+'</div>');}

function pickVF(v){if(S.done)return;S.cur.val=v;redrawZone();}
function pickSingle(k){if(S.done)return;S.cur.val=k;redrawZone();}
function toggleMulti(k){if(S.done)return;if(S.cur.set[k])delete S.cur.set[k];else S.cur.set[k]=true;redrawZone();}
function pickChip(k){if(S.done)return;S.cur.picked=(S.cur.picked===k)?null:k;redrawZone();}
function dropTo(id){
  if(S.done||S.cur.picked===null)return;
  var k=S.cur.picked;
  S.cur.pool=S.cur.pool.filter(function(x){return x!==k;});
  S.cur.bins[id].push(k);S.cur.picked=null;redrawZone();
}
function backToPool(k){
  if(S.done)return;
  Object.keys(S.cur.bins).forEach(function(id){S.cur.bins[id]=S.cur.bins[id].filter(function(x){return x!==k;});});
  if(S.cur.pool.indexOf(k)<0)S.cur.pool.push(k);
  S.cur.picked=null;redrawZone();
}

function validate(){
  var q=Q[S.i];if(S.done)return;
  S.tq=Math.round((Date.now()-S.t0)/1000);
  var ok=false;
  if(q.type==='vf'){
    if(S.cur.val===null)return need('Choisis Vrai ou Faux.');
    ok=(S.cur.val===q.answer);
  }else if(q.type==='single'){
    if(S.cur.val===null)return need('Choisis une réponse.');
    ok=q.opts[S.cur.val].ok;
  }else if(q.type==='multi'){
    var n=Object.keys(S.cur.set).length;
    if(n===0)return need('Choisis au moins une réponse.');
    if(q.exact&&n!==q.exact)return need('Choisis exactement '+q.exact+' bulles.');
    ok=q.opts.every(function(o,k){return o.ok===!!S.cur.set[k];});
  }else if(q.type==='fill'){
    var vals=[],empty=false,oks=[];
    q.show.forEach(function(_,p){var v=norm($('in'+p).value);vals.push(v);if(!v)empty=true;});
    if(empty)return need('Complète tous les trous.');
    if(q.anyOrder){
      var allowed=q.accept[0];
      var distinct=vals.length===2&&vals[0]!==vals[1];
      vals.forEach(function(v){oks.push(distinct&&allowed.indexOf(v)>=0);});
    }else{
      vals.forEach(function(v,p){oks.push(q.accept[p].indexOf(v)>=0);});
    }
    ok=oks.every(function(x){return x;});
    oks.forEach(function(o,p){var el=$('in'+p);el.disabled=true;el.classList.add(o?'good':'soft');});
  }else if(q.type==='sort'){
    if(S.cur.pool.length)return need('Range tous les mots dans une case.');
    ok=q.cats.every(function(cat){return S.cur.bins[cat.id].every(function(k){return q.items[k].cat===cat.id;});});
  }else if(q.type==='text'){
    if(($('zt').value||'').trim().length<5)return need('Écris ta phrase avant de valider.');
    $('zt').disabled=true;S.done=true;
    var li=q.check.map(function(x){return '<li>'+x+'</li>';}).join('');
    $('fb').innerHTML=fr('<div class="fb info"><b>Phrase modèle :</b> '+q.model+'<br><br><b>Le parent vérifie :</b><ul>'+li+'</ul></div>');
    $('act').innerHTML='<button class="btn" onclick="rateText(true)">✅ Réussi</button><button class="btn sec" onclick="rateText(false)">🌱 À revoir</button>';
    return;
  }
  finish(ok);
}
function finish(ok){
  var q=Q[S.i];
  S.res[S.i]=ok;S.done=true;S.det[S.i]=detail(q,ok);
  $('fb').innerHTML=fr(ok?'<div class="fb good">'+PRAISE[Math.floor(Math.random()*PRAISE.length)]+'</div>':'<div class="fb soft">🌱 Pas tout à fait. '+q.expl+'</div>');
  redrawZone();
  $('act').innerHTML=nextBtn();
}
function rateText(ok){S.res[S.i]=ok;S.det[S.i]=detail(Q[S.i],ok);$('act').innerHTML=nextBtn();}
function detail(q,ok){
  var rep='',att='',cur=S.cur;
  var bons=q.opts?q.opts.filter(function(o){return o.ok;}).map(function(o){return o.t;}).join(' ; '):'';
  if(q.type==='vf'){rep=cur.val===null?'':(cur.val?'Vrai':'Faux');att=q.answer?'Vrai':'Faux';}
  else if(q.type==='single'){rep=cur.val===null?'':q.opts[cur.val].t;att=bons;}
  else if(q.type==='multi'){rep=q.opts.filter(function(o,k){return cur.set[k];}).map(function(o){return o.t;}).join(' ; ');att=bons;}
  else if(q.type==='fill'){rep=q.show.map(function(_,p){var e=$('in'+p);return e?e.value.trim():'';}).join(' / ');att=q.show.join(' / ');}
  else if(q.type==='sort'){
    var parts=[];q.cats.forEach(function(c){cur.bins[c.id].forEach(function(k){parts.push(q.items[k].t+' → '+c.t);});});
    rep=parts.join(' ; ');
    att=q.items.map(function(it){var c=q.cats.filter(function(c2){return c2.id===it.cat;})[0];return it.t+' → '+c.t;}).join(' ; ');
  }
  else if(q.type==='text'){var zt=$('zt');rep=zt?zt.value.trim():'';att=q.model;}
  var d={n:S.i+1,ref:'Q'+(S.i+1),comp:q.comp,compLabel:COMP[q.comp].short,type:q.type,enonce:(q.text||q.consigne),reponse:rep,attendu:att,ok:!!ok,tempsSec:S.tq||0,indice:!!S.indice};
  if(q.ctx)d.contexte='Tableau de l’expérience (pots A à D)';
  return d;
}
function nextQ(){if(S.i<Q.length-1){S.i++;showQ();}else showResult();}

function compStats(){
  var st={};
  Q.forEach(function(q,i){
    if(!st[q.comp])st[q.comp]={n:0,ok:0};
    st[q.comp].n++;if(S.res[i])st[q.comp].ok++;
  });
  return st;
}
function level(p){return p>=0.75?{c:'ok',t:'Acquis ✅'}:(p>=0.5?{c:'mid',t:'En cours d\'acquisition 🟡'}:{c:'low',t:'À revoir 🌱'});}
function showResult(){
  var score=S.res.filter(function(x){return x;}).length;
  var msg=score>=11?`Bravo, tu maîtrises la leçon !`:(score>=8?`Très bien ! Encore un petit effort sur quelques points.`:(score>=5?`Tu es sur la bonne voie : relis la leçon puis recommence.`:`Courage ! Relis la leçon et réessaie.`));
  try{localStorage.setItem('evalPlantesCM1_last',JSON.stringify({name:S.name,score:score,date:new Date().toLocaleDateString('fr-FR')}));}catch(e){}
  var st=compStats(),rows='',retiens='',rev='';
  Q.forEach(function(q,i){
    if(S.res[i])return;
    var corr=q.expl||('Phrase modèle : '+q.model);
    rev+='<li><b>Question '+(i+1)+'</b> ('+COMP[q.comp].icon+' '+COMP[q.comp].short+') — '+(q.text||q.consigne)+'<span class="corr">➜ '+corr+'</span></li>';
  });
  var nbKo=Q.length-score;
  if(window.HubHistorique&&!S.saved){
    S.saved=true;
    var comps=Object.keys(COMP).filter(function(k){return st[k];}).map(function(k){return {label:COMP[k].label,ok:st[k].ok,n:st[k].n};});
    var rv=[];Q.forEach(function(q,i){if(!S.res[i])rv.push({q:i+1,texte:q.text||q.consigne,correction:q.expl||('Phrase modèle : '+q.model)});});
    HubHistorique.enregistrer({outil:'evaluation-plantes-cm1',titre:'Évaluation Sciences (graines et plantes)',version:VERSION,joueur:S.name||'joueur',score:score,total:Q.length,dureeSec:S.det.reduce(function(a,d){return a+(d?d.tempsSec:0);},0),competences:comps,aRevoir:rv,questions:S.det});
  }
  Object.keys(COMP).forEach(function(k){
    var s=st[k];if(!s)return;
    var p=s.ok/s.n,lv=level(p);
    rows+='<tr><td>'+COMP[k].icon+' '+COMP[k].label+'</td><td>'+s.ok+'/'+s.n+'</td><td><div class="bar '+(lv.c==='ok'?'':lv.c)+'"><div style="width:'+Math.round(p*100)+'%"></div></div><span class="lvl '+lv.c+'">'+lv.t+'</span></td></tr>';
    if(lv.c!=='ok')retiens+='<div class="retiens"><b>À retenir ('+COMP[k].short+') :</b> '+COMP[k].retiens+'</div>';
  });
  $('screen').innerHTML=fr(`<div class="progress"><div class="pf" style="width:100%"></div></div>
  <section class="card" style="margin-top:8px">
    <span class="tag">🏁 Résultat${S.name?' de '+esc(S.name):''}</span>
    <div class="score">${score} / ${Q.length}</div>
    <div class="msg">${msg}</div>
    <div class="scroll"><table class="bilan"><caption>Bilan des compétences (version ${VERSION})</caption>
      <tr><th>Compétence</th><th>Score</th><th>Bilan</th></tr>${rows}</table></div>
    <p class="consigne">${nbKo?'À revoir : '+nbKo+' question'+(nbKo>1?'s':''):'Rien à revoir 🌟'}</p>
    ${rev?'<ul class="revoir">'+rev+'</ul>':''}
    ${retiens||'<div class="retiens">Toutes les compétences sont acquises. Bravo ! 🌟</div>'}
    ${window.HubHistorique?"<p class=\"mini\">✅ Résultat enregistré dans l’historique du Mode Parent.</p>":""}
    <div class="actions">
      <button class="btn" onclick="showStart()">🔁 Recommencer</button>
      ${window.HubParent?'<button class="btn sec" onclick="HubParent.ouvrir(\'historique\')">👨‍👩‍👧 Historique (Mode Parent)</button><button class="btn sec" onclick="HubParent.ouvrir(\'rapport\')">📋 Rapport pour analyse</button>':''}
      <button class="btn sec" onclick="doPrint(false)">🖨️ Version papier</button>
      <button class="btn sec" onclick="doPrint(true)">🖨️ Corrigé (parent)</button>
    </div>
  </section>`);
  window.scrollTo(0,0);
}

/* ---------- Version imprimable ---------- */
function box(ok){return ok?'☑':'☐';}
function buildPrint(key){
  var h='<div class="phead"><h1>Évaluation de sciences — CM1</h1><h2>Les besoins des graines et des plantes</h2><div class="pline">Nom : ____________________ &nbsp;&nbsp; Date : ______________ &nbsp;&nbsp; Note : ______ / '+Q.length+'</div><div class="pver">'+(key?'CORRIGÉ — réservé au parent · ':'')+'Version '+VERSION+'</div></div>';
  Q.forEach(function(q,i){
    h+='<div class="pq"><div class="pqh"><b>'+(i+1)+'.</b> <i>'+q.consigne+'</i></div>';
    if(q.ctx)h+=q.ctx;
    if(q.type==='vf'){
      h+='<div>'+q.text+'</div><div>'+box(key&&q.answer===true)+' Vrai &nbsp;&nbsp;&nbsp; '+box(key&&q.answer===false)+' Faux</div>';
    }else if(q.type==='single'||q.type==='multi'){
      if(q.text)h+='<div>'+q.text+'</div>';
      if(q.center)h+='<div><b>'+q.center+'</b></div>';
      q.opts.forEach(function(o){h+='<div>'+box(key&&o.ok)+' '+o.t+'</div>';});
    }else if(q.type==='fill'){
      h+='<div style="line-height:2.2">';
      q.parts.forEach(function(p){
        if(typeof p==='number')h+=key?'<span class="ans">'+q.show[p]+'</span>':'<span class="blankp"></span>';
        else h+=p;
      });
      h+='</div>';
    }else if(q.type==='sort'){
      if(!key){h+='<div>Mots à ranger : '+q.items.map(function(it){return '<b>'+it.t+'</b>';}).join(' · ')+'</div>';}
      h+='<div class="pbins">'+q.cats.map(function(cat){
        var inner=key?q.items.filter(function(it){return it.cat===cat.id;}).map(function(it){return '<div class="ans">'+it.t+'</div>';}).join(''):'';
        return '<div class="pbin"><b>'+cat.t+'</b>'+inner+'</div>';
      }).join('')+'</div>';
    }else if(q.type==='text'){
      if(key){h+='<div class="ans">'+q.model+'</div><div style="margin-top:4pt;font-size:10pt">'+q.check.join(' · ')+'</div>';}
      else h+='<div class="pl"></div><div class="pl"></div><div class="pl"></div>';
    }
    h+='</div>';
  });
  var rows='';
  Object.keys(COMP).forEach(function(k){rows+='<tr><td>'+COMP[k].label+'</td><td>☐ Acquis</td><td>☐ En cours</td><td>☐ À revoir</td></tr>';});
  h+='<div class="pq"><table class="bilan"><caption>Bilan des compétences (version '+VERSION+')</caption><tr><th>Compétence</th><th>Acquis</th><th>En cours</th><th>À revoir</th></tr>'+rows+'</table></div>';
  $('printArea').innerHTML=fr(h);
}
function doPrint(key){buildPrint(key);try{window.print();}catch(e){}}

showStart();
</script>
</body>
