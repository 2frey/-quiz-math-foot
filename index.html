<!DOCTYPE html>
<!--
  PAGE D'ACCUEIL (VERSION EN LIGNE) — Mes jeux pour apprendre
  Cette copie ne contient PAS l'Espace adulte : elle est destinée au dépôt GitHub public.
  La version complète est dans « index-complet-local.html » (à garder sur votre PC).
  HISTORIQUE DES VERSIONS
  | Version | Date       | Modifications                                                                  |
  |---------|------------|--------------------------------------------------------------------------------|
  | 2.0     | 2026-10-03 | Version en ligne : ajout de Chrono Devoirs. Cartes générées depuis la liste TOOLS. |
  | 1.0     | 2026-09-27 | Création : 5 cartes (3 « Je m'entraîne », 2 « Ma routine »), message d'accueil   |
  |         |            | selon l'heure, badge « Dernier jeu ouvert »                                      |

  POUR AJOUTER / MODIFIER UN OUTIL :
  ajouter ou changer UNE ligne dans la liste TOOLS (en bas du fichier) : esp = 'e',
  sec = identifiant de section, puis emoji, titre, texte, couleur, href, etiquette et bouton.
  Les liens sont relatifs : chaque fichier doit être à côté de ce index.html.

  -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Mes jeux pour apprendre</title>
<style>
  :root{
    --fond1:#FFF7E6;
    --fond2:#E8F4FF;
    --texte:#1F2340;
    --texte-doux:#5B6280;
    --blanc:#FFFFFF;
    --ombre:0 6px 0 rgba(31,35,64,.12), 0 10px 24px rgba(31,35,64,.10);
    --vert:#2EAD5B;   --vert-clair:#E3F7EA;
    --indigo:#4B45D6; --indigo-clair:#ECEBFF;
    --orange:#FF8A1F; --orange-clair:#FFF0E0;
    --bleu:#1E88E5;   --bleu-clair:#E3F1FD;
    --violet:#8B3FE0; --violet-clair:#F3EAFF;
    --jaune:#FFC93C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:"Segoe UI", "Trebuchet MS", Verdana, Arial, sans-serif;
    color:var(--texte);
    background:
      radial-gradient(circle at 10% 5%, rgba(255,201,60,.35), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(75,69,214,.18), transparent 45%),
      linear-gradient(160deg, var(--fond1), var(--fond2));
    min-height:100vh;
    padding:24px 16px 40px;
    -webkit-tap-highlight-color:transparent;
  }
  .page{max-width:900px;margin:0 auto;}

  /* ---------- En-tête ---------- */
  header{text-align:center;margin-bottom:22px;}
  .mascotte{
    font-size:56px;line-height:1;display:inline-block;
    animation:rebond 2.4s ease-in-out infinite;
  }
  @keyframes rebond{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-8px) rotate(4deg);}
  }
  h1{
    margin:8px 0 4px;
    font-size:clamp(28px, 6vw, 42px);
    font-weight:900;letter-spacing:.5px;
    background:linear-gradient(90deg, var(--orange), var(--violet), var(--bleu));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .salut{font-size:clamp(16px, 3.6vw, 20px);font-weight:700;margin:0;}
  .motiv{font-size:15px;color:var(--texte-doux);margin:6px 0 0;min-height:20px;}

  /* ---------- Consigne ---------- */
  .consigne{
    background:var(--blanc);
    border:3px dashed var(--jaune);
    border-radius:18px;
    padding:12px 16px;
    text-align:center;
    font-weight:800;font-size:16px;
    margin:0 auto 26px;max-width:560px;
  }

  /* ---------- Badge « Dernier jeu » ---------- */
  .reprise{
    display:none;
    align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    background:var(--blanc);border:2px solid var(--vert);
    border-radius:40px;padding:10px 18px;
    margin:-12px auto 24px;width:fit-content;max-width:100%;
    font-weight:700;font-size:15px;color:var(--texte);
    text-decoration:none;box-shadow:var(--ombre);
  }
  .reprise.visible{display:flex;}
  .reprise:active{transform:scale(.97);}
  .reprise b{color:var(--vert);}

  /* ---------- Sections ---------- */
  section{margin-bottom:30px;}
  .titre-section{
    display:flex;align-items:center;gap:10px;
    font-size:21px;font-weight:900;margin:0 0 14px 4px;
  }
  .titre-section .pastille{
    font-size:12px;font-weight:800;color:var(--texte-doux);
    background:var(--blanc);border-radius:20px;padding:3px 10px;
  }
  .grille{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:16px;
  }

  /* ---------- Cartes ---------- */
  .carte{
    --c:var(--indigo);--c-clair:var(--indigo-clair);
    position:relative;display:flex;flex-direction:column;
    background:var(--blanc);
    border:3px solid var(--c-clair);
    border-radius:22px;
    padding:18px 18px 16px;
    text-decoration:none;color:var(--texte);
    box-shadow:var(--ombre);
    transition:transform .15s ease, border-color .15s ease;
    min-height:190px;
  }
  .carte:hover{transform:translateY(-4px);border-color:var(--c);}
  .carte:active{transform:scale(.97);}
  .carte:focus-visible{outline:4px solid var(--c);outline-offset:3px;}
  .carte .icone{
    width:64px;height:64px;border-radius:18px;
    background:var(--c-clair);
    display:flex;align-items:center;justify-content:center;
    font-size:36px;margin-bottom:12px;
  }
  .carte h3{margin:0 0 6px;font-size:19px;font-weight:900;}
  .carte p{margin:0 0 14px;font-size:14.5px;line-height:1.45;color:var(--texte-doux);flex:1;}
  .carte .jouer{
    align-self:flex-start;
    background:var(--c);color:#fff;
    font-weight:800;font-size:15px;
    padding:10px 18px;border-radius:30px;
    box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  .carte .etiquette{
    position:absolute;top:14px;right:14px;
    font-size:11.5px;font-weight:800;
    color:var(--c);background:var(--c-clair);
    padding:4px 10px;border-radius:20px;
  }
  .carte.vert{--c:var(--vert);--c-clair:var(--vert-clair);}
  .carte.indigo{--c:var(--indigo);--c-clair:var(--indigo-clair);}
  .carte.orange{--c:var(--orange);--c-clair:var(--orange-clair);}
  .carte.bleu{--c:var(--bleu);--c-clair:var(--bleu-clair);}
  .carte.violet{--c:var(--violet);--c-clair:var(--violet-clair);}

  footer{
    text-align:center;font-size:12px;color:var(--texte-doux);
    opacity:.75;margin-top:10px;
  }

  @media (max-width:420px){
    body{padding:18px 12px 32px;}
    .grille{grid-template-columns:1fr;}
    .carte{min-height:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .mascotte{animation:none;}
    .carte{transition:none;}
  }

  /* ---------- v2.0 : deux espaces ---------- */
  .page{position:relative;}
  .vue{display:none;} .vue.on{display:block;}
  .barre{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 24px;}
  .bouton{
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    background:var(--indigo);color:#fff;border:none;border-radius:30px;
    padding:11px 20px;min-height:46px;box-shadow:0 4px 0 #3631A8;
  }
  .bouton:active{transform:translateY(2px);box-shadow:0 2px 0 #3631A8;}
  .bouton.gris{background:#8A90AA;box-shadow:0 4px 0 #646A84;}
  .bouton.lien{background:var(--blanc);color:var(--texte-doux);box-shadow:0 3px 0 rgba(31,35,64,.12);border:2px solid #D9DCEB;}
  .boite{
    background:var(--blanc);border-radius:22px;box-shadow:var(--ombre);
    padding:22px 18px;max-width:460px;margin:0 auto;text-align:center;
  }
  .boite h2{margin:6px 0 6px;font-size:22px;}
  .boite p{margin:0 0 12px;color:var(--texte-doux);font-size:15px;line-height:1.45;}
  .champ{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0;}
  .champ input{
    font-family:inherit;font-size:20px;padding:10px 12px;width:100%;max-width:280px;
    border:3px solid #CBD0E6;border-radius:14px;
  }
  .oeil{font-family:inherit;font-size:20px;background:#F4F5FB;border:3px solid #CBD0E6;border-radius:14px;padding:8px 12px;min-height:48px;cursor:pointer;}
  .msg{min-height:22px;font-weight:700;font-size:15px;color:var(--texte-doux);margin:8px 0;}
  .note{font-size:13px;color:var(--texte-doux);text-align:center;max-width:560px;margin:0 auto 14px;line-height:1.45;}
  .carte.gris{--c:#5B6280;--c-clair:#ECEEF5;}

</style>
</head>
<body>
<div class="page">

  <!-- ================= ESPACE ENFANTS ================= -->
  <div class="vue on" id="vue-enfants">
    <header>
      <div class="mascotte" aria-hidden="true">🚀</div>
      <h1>Mes jeux pour apprendre</h1>
      <p class="salut" id="salut">Bonjour, champion !</p>
      <p class="motiv" id="motiv"></p>
    </header>
    <div class="consigne">👆 Touche une carte pour lancer le jeu de ton choix.</div>
    <a class="reprise" id="reprise" href="#">▶️ Dernier jeu ouvert : <b id="reprise-nom"></b></a>
    <div id="sections-e"></div>
  </div>

  <footer>Mes jeux pour apprendre — v2.0 (en ligne)</footer>
</div>

<script>
(function(){
  "use strict";
  var CLE_DERNIER = "accueil:dernierJeu";

  /* ===================== LISTE DES OUTILS (1 ligne = 1 carte) ===================== */
  var SECTIONS = [
    { id:"entrainement", esp:"e", titre:"🎯 Je m'entraîne", pastille:"maths" },
    { id:"devoirs",      esp:"e", titre:"⏱️ Mes devoirs",   pastille:"chrono & méthode" },
    { id:"routine",      esp:"e", titre:"☀️ Ma routine",    pastille:"missions du jour" }
  ];
  var TOOLS = [
    { esp:"e", sec:"entrainement", emoji:"⚽", titre:"Quiz Math Foot", texte:"Marque des buts en révisant tes tables de multiplication !", couleur:"vert", href:"quiz-math-foot.html", etiquette:"Tables ×", bouton:"▶ Jouer" },
    { esp:"e", sec:"entrainement", emoji:"🧮", titre:"Résolution de problèmes", texte:"Pokémon, foot, voitures… Résous 3 problèmes et écris ta phrase réponse.", couleur:"indigo", href:"resolution_problemes_cm1.html", etiquette:"Problèmes", bouton:"▶ Jouer" },
    { esp:"e", sec:"entrainement", emoji:"📝", titre:"Évaluation Repères CM2", texte:"Pose tes opérations en colonne et résous les problèmes. Montre ce que tu sais faire !", couleur:"orange", href:"evaluation-reperes-cm1.html", etiquette:"Évaluation", bouton:"▶ Commencer" },
    { esp:"e", sec:"devoirs", emoji:"⏱️", titre:"Chrono Devoirs", texte:"Chronomètre tes devoirs, bats ton record, gagne des points et des badges. Avec des astuces pour bien travailler !", couleur:"bleu", href:"chrono-devoirs.html", etiquette:"Devoirs", bouton:"▶ C'est parti" },
    { esp:"e", sec:"routine", emoji:"💍", titre:"Sonic Quest du Matin", texte:"Chaque tâche accomplie rapporte des anneaux dorés. Débloque tes récompenses !", couleur:"bleu", href:"sonic-quest-du-matin.html", etiquette:"Matin", bouton:"▶ C'est parti" },
    { esp:"e", sec:"routine", emoji:"⚡", titre:"Level Up Zone", texte:"Accomplis tes missions, gagne de l'XP et monte de niveau.", couleur:"violet", href:"level-up-zone.html", etiquette:"XP", bouton:"▶ C'est parti" }

  ];

  function $(id){ return document.getElementById(id); }

  /* ===================== CONSTRUCTION DES CARTES ===================== */
  function creerCarte(o){
    var a = document.createElement("a");
    a.className = "carte " + o.couleur;
    a.setAttribute("href", o.href);
    if(o.esp === "e") a.setAttribute("data-nom", o.titre);
    var e = document.createElement("span"); e.className = "etiquette"; e.textContent = o.etiquette; a.appendChild(e);
    var i = document.createElement("div"); i.className = "icone"; i.textContent = o.emoji; a.appendChild(i);
    var h = document.createElement("h3"); h.textContent = o.titre; a.appendChild(h);
    var p = document.createElement("p"); p.textContent = o.texte; a.appendChild(p);
    var b = document.createElement("span"); b.className = "jouer"; b.textContent = o.bouton; a.appendChild(b);
    return a;
  }
  function construire(){
    SECTIONS.forEach(function(s){
      var outils = TOOLS.filter(function(t){ return t.sec === s.id && t.esp === s.esp; });
      if(!outils.length) return;
      var sec = document.createElement("section");
      var h2 = document.createElement("h2"); h2.className = "titre-section";
      h2.appendChild(document.createTextNode(s.titre + " "));
      var pa = document.createElement("span"); pa.className = "pastille"; pa.textContent = s.pastille; h2.appendChild(pa);
      sec.appendChild(h2);
      var g = document.createElement("div"); g.className = "grille";
      outils.forEach(function(t){ g.appendChild(creerCarte(t)); });
      sec.appendChild(g);
      $(s.esp === "e" ? "sections-e" : "sections-a").appendChild(sec);
    });
  }

  /* ===================== DERNIER JEU (espace enfants uniquement) ===================== */
  function lire(){ try{ return JSON.parse(localStorage.getItem(CLE_DERNIER)); }catch(e){ return null; } }
  function ecrire(obj){ try{ localStorage.setItem(CLE_DERNIER, JSON.stringify(obj)); }catch(e){} }
  function brancherDernier(){
    var cartes = $("sections-e").querySelectorAll(".carte");
    for(var i = 0; i < cartes.length; i++){
      cartes[i].addEventListener("click", function(){
        ecrire({ nom: this.getAttribute("data-nom"), href: this.getAttribute("href") });
      });
    }
    var d = lire();
    if(d && d.nom && d.href){
      $("reprise").setAttribute("href", d.href);
      $("reprise-nom").textContent = d.nom;
      $("reprise").classList.add("visible");
    }
  }

  /* ===================== MESSAGE D'ACCUEIL ===================== */
  function accueil(){
    var h = new Date().getHours();
    $("salut").textContent = h < 12 ? "Bonjour, champion ! ☀️" : (h < 18 ? "Bon après-midi, champion ! 🌤️" : "Bonsoir, champion ! 🌙");
    var PHRASES = [
      "Chaque bonne réponse te rend plus fort 💪", "Aujourd'hui, on vise le niveau supérieur ! 🏆",
      "Se tromper, c'est apprendre. Vas-y ! 🌟", "Un petit peu chaque jour, et tu deviens imbattable 🚀", "Prêt à relever le défi ? 🎯"
    ];
    $("motiv").textContent = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  }

  /* ===================== DÉMARRAGE ===================== */
  construire(); accueil(); brancherDernier();
})();
</script>
</body>
</html>
