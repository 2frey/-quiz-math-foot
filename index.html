<title>Mes jeux pour apprendre</title>
<style>
  :root{
    --fond1:#FFF7E6; --fond2:#E8F4FF;
    --texte:#1F2340; --texte-doux:#4A5170; --blanc:#FFFFFF;
    --ombre:0 6px 0 rgba(31,35,64,.12), 0 10px 24px rgba(31,35,64,.10);
    --jaune:#FFC93C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  [hidden]{display:none !important;}
  body{
    font-family:"Segoe UI","Trebuchet MS",Verdana,Arial,sans-serif;
    color:var(--texte);
    background:
      radial-gradient(circle at 10% 5%, rgba(255,201,60,.35), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(75,69,214,.18), transparent 45%),
      linear-gradient(160deg, var(--fond1), var(--fond2));
    min-height:100vh;
    padding:14px 14px 40px;
    -webkit-tap-highlight-color:transparent;
  }
  .page{max-width:1040px;margin:0 auto;}
  .saut{position:absolute;left:-999px;top:8px;background:#fff;color:var(--texte);padding:10px 14px;border-radius:10px;font-weight:800;z-index:3000000000;}
  .saut:focus{left:8px;}
  a:focus-visible,button:focus-visible{outline:4px solid #1F2340;outline-offset:3px;}

  /* ---------- En-tête compact ---------- */
  header{text-align:center;margin:4px 0 14px;}
  .mascotte{font-size:44px;line-height:1;display:inline-block;animation:rebond 2.4s ease-in-out infinite;}
  @keyframes rebond{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-6px) rotate(4deg);}}
  h1{
    margin:4px 0 2px;font-size:clamp(26px,6vw,40px);font-weight:900;letter-spacing:.5px;
    background:linear-gradient(90deg,#C2410C,#7C3AED,#1565C0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .salut{font-size:clamp(16px,3.6vw,20px);font-weight:800;margin:0;}
  .motiv{font-size:15px;color:var(--texte-doux);margin:4px 0 0;min-height:20px;}
  .stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0;}
  .stat{background:var(--blanc);border-radius:20px;padding:6px 14px;font-weight:800;font-size:14.5px;box-shadow:0 2px 0 rgba(31,35,64,.10);}

  /* ---------- Reprendre ---------- */
  .reprise{margin:0 0 16px;text-align:center;}
  .reprise h2{font-size:15px;margin:0 0 8px;color:var(--texte-doux);font-weight:800;}
  .puces{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .puce{
    display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;
    background:var(--blanc);border:2px solid #1B7A38;border-radius:30px;
    color:var(--texte);text-decoration:none;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(31,35,64,.10);
  }
  .puce:active{transform:scale(.97);}

  /* ---------- Menu des rubriques ---------- */
  .rubriques{
    position:sticky;top:var(--hubc-h,0px);z-index:20;
    display:flex;gap:8px;overflow-x:auto;padding:8px 2px;margin:0 0 10px;
    background:linear-gradient(180deg,rgba(255,247,230,.96),rgba(255,247,230,.85));
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .rubriques::-webkit-scrollbar{display:none;}
  .rubriques a{
    flex:0 0 auto;min-height:40px;display:inline-flex;align-items:center;padding:6px 14px;
    background:var(--blanc);border:2px solid #CBD0E6;border-radius:24px;
    color:var(--texte);text-decoration:none;font-weight:800;font-size:14.5px;
  }
  .rubriques a:active{transform:scale(.97);}

  /* ---------- Résumé parent ---------- */
  .parent{
    background:#FFFFFF;border:3px solid #4338CA;border-radius:20px;padding:14px 16px;margin:0 0 22px;
    box-shadow:var(--ombre);
  }
  .parent h2{margin:0 0 6px;font-size:18px;}
  .parent p{margin:4px 0;font-size:15px;line-height:1.45;}
  .parent .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .bouton{
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;min-height:44px;
    background:#4338CA;color:#fff;border:none;border-radius:30px;padding:10px 18px;box-shadow:0 3px 0 #2E2790;
  }
  .bouton.clair{background:#fff;color:#4338CA;border:2px solid #4338CA;box-shadow:none;}

  /* ---------- Consigne ---------- */
  .consigne{
    background:var(--blanc);border:3px dashed var(--jaune);border-radius:18px;
    padding:10px 16px;text-align:center;font-weight:800;font-size:16px;margin:0 auto 18px;max-width:560px;
  }

  /* ---------- Sections ---------- */
  section.rub{margin-bottom:28px;scroll-margin-top:calc(var(--hubc-h,0px) + 64px);}
  .titre-section{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:21px;font-weight:900;margin:0 0 12px 4px;}
  .titre-section .pastille{font-size:12.5px;font-weight:800;color:var(--texte-doux);background:var(--blanc);border-radius:20px;padding:3px 10px;}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

  /* ---------- Cartes ---------- */
  .carte{
    --c:#4338CA;--c-clair:#ECEBFF;
    position:relative;display:flex;flex-direction:column;
    background:var(--blanc);border:3px solid var(--c-clair);border-radius:22px;
    padding:18px 18px 16px;text-decoration:none;color:var(--texte);
    box-shadow:var(--ombre);transition:transform .15s ease, border-color .15s ease;min-height:190px;
  }
  .carte:hover{transform:translateY(-4px);border-color:var(--c);}
  .carte:active{transform:scale(.97);}
  .carte .icone{width:64px;height:64px;border-radius:18px;background:var(--c-clair);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:12px;}
  .carte h3{margin:0 0 6px;font-size:19px;font-weight:900;}
  .carte p{margin:0 0 14px;font-size:14.5px;line-height:1.45;color:var(--texte-doux);flex:1;}
  .pied-carte{display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
  .carte .jouer{background:var(--c);color:#fff;font-weight:800;font-size:15px;padding:10px 18px;border-radius:30px;box-shadow:0 3px 0 rgba(0,0,0,.2);}
  .carte .vu{font-size:13px;font-weight:800;color:#1B5E20;}
  .carte .etiquette{position:absolute;top:14px;right:14px;font-size:12px;font-weight:800;color:var(--c);background:var(--c-clair);padding:4px 10px;border-radius:20px;}
  .nouveau{display:inline-block;margin-left:8px;vertical-align:middle;font-size:11.5px;font-weight:900;color:#7A2E00;background:#FFD27A;border-radius:12px;padding:2px 8px;}
  .carte.vert{--c:#1B7A38;--c-clair:#E3F7EA;}
  .carte.indigo{--c:#4338CA;--c-clair:#ECEBFF;}
  .carte.orange{--c:#B45309;--c-clair:#FFF0E0;}
  .carte.bleu{--c:#1565C0;--c-clair:#E3F1FD;}
  .carte.violet{--c:#7C3AED;--c-clair:#F3EAFF;}
  .carte.indisponible{opacity:.62;filter:grayscale(.55);cursor:not-allowed;}
  .carte.indisponible:hover{transform:none;border-color:var(--c-clair);}

  /* ---------- Qui joue ? (v4.0) ---------- */
  .qui-joue{text-align:center;margin:6px auto 26px;max-width:760px;}
  .qui-joue h2{font-size:24px;margin:0 0 14px;font-weight:900;}
  .choix-joueurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .choix-joueur{
    font-family:inherit;cursor:pointer;background:#fff;border:3px solid #CBD0E6;border-radius:22px;
    padding:18px 10px;box-shadow:var(--ombre);font-size:20px;font-weight:900;color:var(--texte);
    min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .choix-joueur .avatar{font-size:48px;line-height:1;}
  .choix-joueur:hover{border-color:#4338CA;}
  .choix-joueur:active{transform:scale(.97);}
  .joueur-actif{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 0;}
  .joueur-actif .bouton{min-height:38px;padding:6px 14px;font-size:14px;}
  .aucun-jeu{text-align:center;font-weight:800;font-size:16px;background:#fff;border-radius:18px;padding:18px;box-shadow:var(--ombre);}

  /* ---------- Fenêtre « Joueurs et jeux » (Mode Parent, v4.0) ---------- */
  .pj-fond{position:fixed;inset:0;z-index:2147483000;background:rgba(20,22,40,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
  .pj-boite{background:#fff;border-radius:20px;max-width:760px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto 0;}
  .pj-boite h2{margin:0 0 4px;font-size:21px;}
  .pj-boite h3{margin:18px 0 8px;font-size:16.5px;color:#4338CA;}
  .pj-aide{font-size:14px;color:var(--texte-doux);margin:4px 0;line-height:1.4;}
  .pj-ligne{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .pj-ligne input{font-family:inherit;font-size:16px;padding:9px 10px;border:2px solid #CBD0E6;border-radius:12px;}
  .pj-ligne .pj-emoji{width:64px;text-align:center;}
  .pj-ligne .pj-nom{flex:1;min-width:140px;}
  .pj-jeu{border:2px solid #ECEBFF;border-radius:14px;padding:10px 12px;margin-bottom:8px;}
  .pj-jeu-titre{font-weight:800;margin-bottom:6px;}
  .pj-jeu-titre small{font-weight:700;color:var(--texte-doux);}
  .pj-puces{display:flex;flex-wrap:wrap;gap:8px;}
  .pj-puce{font-family:inherit;cursor:pointer;min-height:40px;padding:6px 14px;border-radius:24px;border:2px solid #CBD0E6;background:#fff;font-weight:800;font-size:14.5px;color:var(--texte-doux);}
  .pj-puce.on{background:#E3F7EA;border-color:#1B7A38;color:#14532D;}
  .pj-statut{font-size:14px;font-weight:800;margin:12px 0 0;}
  .pj-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .pj-connexion{background:#F4F5FB;border-radius:14px;padding:12px;margin-top:12px;}
  .pj-connexion input{width:100%;font-family:inherit;font-size:16px;padding:10px;border:2px solid #CBD0E6;border-radius:12px;margin:4px 0;}
  .pj-mdp{position:relative;}
  .pj-mdp input{padding-right:46px;}
  .pj-oeil{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;padding:4px;}
  .pj-erreur{color:#B91C1C;font-weight:800;font-size:14px;min-height:18px;margin-top:6px;}
  .bouton.rouge{background:#fff;color:#B91C1C;border:2px solid #B91C1C;box-shadow:none;}
  #toast-hub{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2147483600;background:#1F2340;color:#fff;font-weight:800;padding:12px 20px;border-radius:14px;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3);}

  footer{text-align:center;font-size:12.5px;color:var(--texte-doux);margin-top:10px;}
  noscript .consigne{border-color:#C2410C;}

  @media (min-width:900px){body{padding:20px 24px 48px;}.grille{gap:20px;}}
  @media (max-width:420px){
    body{padding:10px 10px 32px;}
    .grille{grid-template-columns:1fr;}
    .carte{min-height:0;}
  }
  @media (prefers-reduced-motion:reduce){.mascotte{animation:none;}.carte{transition:none;}}
</style>
</head>

<script>
(function(){
  "use strict";
  var CLE_DERNIER = "accueil:dernierJeu";      /* ancienne clé (conservée) */
  var CLE_DERNIERS = "accueil:derniersJeux";    /* 3 derniers jeux */
  var CLE_VUS = "hub:vus";                      /* jours où un jeu a été ouvert */

  /* ===================== LISTE DES OUTILS (1 ligne = 1 carte) ===================== */
  var SECTIONS = [
    { id:"entrainement", esp:"e", titre:"🎯 Je m'entraîne", pastille:"maths" },

    { id:"routine", esp:"e", titre:"☀️ Ma routine", pastille:"missions du jour" }
  ];
  var TOOLS = [
    { esp:"e", sec:"entrainement", emoji:"⚽", titre:"Quiz Math Foot", texte:"Marque des buts en révisant tes tables de multiplication !", couleur:"vert", href:"quiz-math-foot.html", etiquette:"Tables ×", bouton:"▶ Jouer" },
    { esp:"e", sec:"entrainement", emoji:"🧮", titre:"Résolution de problèmes", texte:"Pokémon, foot, voitures… Résous 3 problèmes et écris ta phrase réponse.", couleur:"indigo", href:"resolution_problemes_cm1.html", etiquette:"Problèmes", bouton:"▶ Jouer" },
    { esp:"e", sec:"entrainement", emoji:"📝", titre:"Évaluation Repères CM2", texte:"Pose tes opérations en colonne et résous les problèmes. Montre ce que tu sais faire !", couleur:"orange", href:"evaluation-reperes-cm1.html", etiquette:"Évaluation", bouton:"▶ Commencer" },
    { esp:"e", sec:"anglais", emoji:"🗣️", titre:"English Quest", texte:"10 missions pour réviser les jours, la date, to be, les pays et les nationalités avant le test !", couleur:"bleu", href:"revision-anglais-cm2.html", etiquette:"Test n°6", bouton:"▶ Jouer", ajout:"2026-11-08" },
    { esp:"e", sec:"lecons", emoji:"🌱", titre:"Évaluation Sciences", texte:"Graines et plantes : réponds aux questions et découvre ton score !", couleur:"vert", href:"evaluation-plantes-cm1.html", etiquette:"Évaluation", bouton:"▶ Commencer", ajout:"2026-11-07" },
    { esp:"e", sec:"devoirs", emoji:"⏱️", titre:"Chrono Devoirs", texte:"Chronomètre tes devoirs, bats ton record, gagne des points et des badges. Avec des astuces pour bien travailler !", couleur:"bleu", href:"chrono-devoirs.html", etiquette:"Devoirs", bouton:"▶ C'est parti" },
    { esp:"e", sec:"routine", emoji:"💍", titre:"Sonic Quest du Matin", texte:"Chaque tâche accomplie rapporte des anneaux dorés. Débloque tes récompenses !", couleur:"bleu", href:"sonic-quest-du-matin.html", etiquette:"Matin", bouton:"▶ C'est parti" },
    { esp:"e", sec:"routine", emoji:"⚡", titre:"Level Up Zone", texte:"Accomplis tes missions, gagne de l'XP et monte de niveau.", couleur:"violet", href:"level-up-zone.html", etiquette:"XP", bouton:"▶ C'est parti" }
  ];

  function $(id){ return document.getElementById(id); }
  function z2(n){ return (n < 10 ? "0" : "") + n; }
  function cleJour(d){ return d.getFullYear() + "-" + z2(d.getMonth() + 1) + "-" + z2(d.getDate()); }
  function jourPrecedent(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1); }
  function parseJour(s){ var p = String(s).split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function lire(k, def){ try{ var v = JSON.parse(localStorage.getItem(k)); return (v === null || v === undefined) ? def : v; }catch(e){ return def; } }
  function ecrire(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function pluriel(n, mot){ return n + " " + mot + (n > 1 ? "s" : ""); }

  /* ===================== CONSTRUCTION DES CARTES ===================== */
  function estNouveau(o){
    if(!o.ajout) return false;
    var t = new Date(); var auj = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var age = Math.floor((auj.getTime() - parseJour(o.ajout).getTime()) / 86400000);
    return age >= 0 && age <= 14;
  }
  function creerCarte(o){
    var a = document.createElement("a");
    a.className = "carte " + o.couleur;
    a.setAttribute("href", o.href);
    a.setAttribute("data-nom", o.titre);
    var e = document.createElement("span"); e.className = "etiquette"; e.textContent = o.etiquette; a.appendChild(e);
    var i = document.createElement("div"); i.className = "icone"; i.setAttribute("aria-hidden", "true"); i.textContent = o.emoji; a.appendChild(i);
    var h = document.createElement("h3"); h.textContent = o.titre;
    if(estNouveau(o)){ var n = document.createElement("span"); n.className = "nouveau"; n.textContent = "✨ Nouveau"; h.appendChild(n); }
    a.appendChild(h);
    var p = document.createElement("p"); p.textContent = o.texte; a.appendChild(p);
    var pied = document.createElement("div"); pied.className = "pied-carte";
    var b = document.createElement("span"); b.className = "jouer"; b.textContent = o.bouton; pied.appendChild(b);

  /* ===================== SUIVI : jours, ouverts aujourd'hui, derniers jeux ===================== */
  function enregistrerOuverture(nom, href){
    var auj = cleJour(new Date());
    var vus = lire(CLE_VUS, {});
    if(!vus[auj]) vus[auj] = [];
    if(vus[auj].indexOf(nom) < 0) vus[auj].push(nom);
    var cles = Object.keys(vus).sort();
    while(cles.length > 60){ delete vus[cles.shift()]; }
    ecrire(CLE_VUS, vus);
    var l = lire(CLE_DERNIERS, []).filter(function(x){ return x.nom !== nom; });
    l.unshift({ nom: nom, href: href });
    ecrire(CLE_DERNIERS, l.slice(0, 3));
    ecrire(CLE_DERNIER, { nom: nom, href: href });
  }
  function serieJours(vus){
    var d = new Date(), n = 0;
    if(!vus[cleJour(d)]) d = jourPrecedent(d);
    while(vus[cleJour(d)]){ n++; d = jourPrecedent(d); }
    return n;
  }
  function majStats(){
    var vus = lire(CLE_VUS, {}), auj = vus[cleJour(new Date())] || [], serie = serieJours(vus), z = $("stats");
    z.innerHTML = "";
    var add = function(t){ var s = document.createElement("span"); s.className = "stat"; s.textContent = t; z.appendChild(s); };
    if(serie > 0) add("🔥 " + pluriel(serie, "jour") + " de suite");
    if(auj.length > 0) add("✅ " + auj.length + (auj.length > 1 ? " jeux ouverts" : " jeu ouvert") + " aujourd'hui");
    if(serie === 0 && auj.length === 0) add("🌟 Ouvre un jeu pour lancer ta série !");
    var cartes = document.querySelectorAll(".carte");
    for(var i = 0; i < cartes.length; i++){
      var vu = cartes[i].querySelector(".vu");
      vu.hidden = auj.indexOf(cartes[i].getAttribute("data-nom")) < 0;
    }
  }
  function majReprise(){
    var l = lire(CLE_DERNIERS, []);
    if(!l.length){ var d = lire(CLE_DERNIER, null); if(d && d.nom && d.href) l = [d]; }
    l = l.filter(function(x){ return TOOLS.some(function(t){ return t.href === x.href && estVisible(t); }); });
    var z = $("puces"); z.innerHTML = "";
    l.forEach(function(x){
      var t = TOOLS.filter(function(t){ return t.href === x.href; })[0];
      var a = document.createElement("a"); a.className = "puce"; a.href = x.href;

  function brancherClics(){

  /* ===================== PAGES ABSENTES : carte grisée ===================== */
  function verifierDisponibilite(){
    if(!window.fetch || location.protocol === "file:") return;
    var cartes = document.querySelectorAll(".carte");
    Array.prototype.forEach.call(cartes, function(c){

  /* ===================== RÉSUMÉ DE LA SEMAINE (Mode Parent déverrouillé) ===================== */
  function majParent(){
    var z = $("zone-parent");
    if(!window.HubParent || !window.HubHistorique || !window.HubParent.actif()){ z.hidden = true; return; }
    var l = window.HubHistorique.lister().filter(function(e){ return e.date >= Date.now() - 7 * 86400000; });
    z.innerHTML = ""; z.hidden = false;
    var h = document.createElement("h2"); h.textContent = "👨‍👩‍👧 Résumé de la semaine"; z.appendChild(h);
    var p = function(t){ var e = document.createElement("p"); e.textContent = t; z.appendChild(e); };
    if(!l.length){ p("Aucune évaluation terminée ces 7 derniers jours."); }
    else {
      var somme = 0, nb = 0, comp = {};
      l.forEach(function(e){
        if(e.total){ somme += e.score / e.total; nb++; }
        (e.competences || []).forEach(function(c){ comp[c.label] = comp[c.label] || { ok:0, n:0 }; comp[c.label].ok += c.ok; comp[c.label].n += c.n; });
      });
      p(pluriel(l.length, "évaluation") + " terminée" + (l.length > 1 ? "s" : "") + (nb ? " · moyenne " + Math.round(100 * somme / nb) + " %" : "") + ".");
      var faibles = Object.keys(comp).filter(function(k){ return comp[k].n >= 2 && comp[k].ok / comp[k].n < 0.75; })
        .sort(function(a, b){ return comp[a].ok / comp[a].n - comp[b].ok / comp[b].n; }).slice(0, 2);
      p(faibles.length ? "À revoir en priorité : " + faibles.map(function(k){ return k + " (" + Math.round(100 * comp[k].ok / comp[k].n) + " %)"; }).join(" ; ") + "." : "Aucune compétence en difficulté cette semaine. 🌟");
    }
    var act = document.createElement("div"); act.className = "actions";
    var b1 = document.createElement("button"); b1.type = "button"; b1.className = "bouton"; b1.textContent = "📊 Historique";
    b1.addEventListener("click", function(){ window.HubParent.ouvrir("historique"); });
    var b2 = document.createElement("button"); b2.type = "button"; b2.className = "bouton clair"; b2.textContent = "📋 Rapport pour analyse";
    b2.addEventListener("click", function(){ window.HubParent.ouvrir("rapport"); });
    var b3 = document.createElement("button"); b3.type = "button"; b3.className = "bouton"; b3.textContent = "👥 Joueurs et jeux";

  /* ===================== JOUEURS ET JEUX DÉDIÉS (v4.0) =====================
     Configuration : { joueurs:[{id, nom, emoji}], attributions:[{href, joueurs:[id…]}], maj }
     - enregistrée en ligne dans Firebase (projet quizz-multiplication, document hub/joueurs),
       écriture réservée au compte parent (règle Firestore côté serveur, aucun email dans ce fichier) ;
     - copie locale (localStorage) : la page fonctionne aussi hors connexion ;
     - un jeu absent des attributions (jamais réglé, ou ajouté par le robot) est visible par tous ;
     - le joueur choisi est mémorisé sur l'appareil (bouton « Changer de joueur »). */
  var CLE_CONFIG = "hub:configJoueurs";
  var CLE_ACTIF = "hub:joueurActif";
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAP8dleVoF3ejPe4R4Q5ef8HpY1QQSIwtg",
    authDomain: "quizz-multiplication.firebaseapp.com",
    projectId: "quizz-multiplication",
    storageBucket: "quizz-multiplication.firebasestorage.app",
    messagingSenderId: "869707235327",
    appId: "1:869707235327:web:cc122791ba8727687a71ca"
  };
  var config = normaliser(lire(CLE_CONFIG, null));
  var db = null, firebaseOK = false, etatSync = "local", desabonnerConfig = null;

  function esc(t){ return String(t === null || t === undefined ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function normaliser(c){
    c = c || {};
    var joueurs = Array.isArray(c.joueurs) ? c.joueurs.filter(function(j){ return j && j.id && j.nom; }) : [];
    var att = Array.isArray(c.attributions) ? c.attributions.filter(function(a){ return a && a.href && Array.isArray(a.joueurs); }) : [];
    return { joueurs: joueurs, attributions: att, maj: Number(c.maj) || 0, nonSync: !!c.nonSync };
  }
  function attributionDe(cfg, href){
    for(var i = 0; i < cfg.attributions.length; i++){ if(cfg.attributions[i].href === href) return cfg.attributions[i]; }
    return null;
  }
  function joueurActif(){
    var id = lire(CLE_ACTIF, null);
    return config.joueurs.filter(function(j){ return j.id === id; })[0] || null;
  }
  function estVisible(t){
    var j = joueurActif();
    if(!j) return true;
    var a = attributionDe(config, t.href);
    if(!a) return true;                       /* jeu jamais réglé : visible par tous */
    return a.joueurs.indexOf(j.id) >= 0;
  }

  /* ---------- Firebase : lecture en direct + connexion ---------- */
  function ecouterConfig(){
    if(desabonnerConfig){ try{ desabonnerConfig(); }catch(e){} }
    desabonnerConfig = db.collection("hub").doc("joueurs").onSnapshot(function(doc){
      etatSync = "en-ligne"; majStatutPJ();
      if(!doc.exists) return;
      if(config.nonSync && config.maj >= (Number(doc.data().maj) || 0)) return;   /* réglage local plus récent, pas encore envoyé */
      config = normaliser(doc.data());
      ecrire(CLE_CONFIG, config);
      afficherSelonJoueur();
    }, function(err){
      etatSync = (err && err.code === "permission-denied") ? "refus-lecture" : "hors-ligne";
      console.warn("Lecture hub/joueurs impossible.", err); majStatutPJ();
    });
  }
  function connexionAnonyme(){
    return firebase.auth().signInAnonymously().then(function(){ firebaseOK = true; ecouterConfig(); });
  }
  function demarrerFirebase(){
    if(typeof firebase === "undefined" || location.protocol === "file:"){ etatSync = "local"; return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){ etatSync = "local"; return; }
    var stop = firebase.auth().onAuthStateChanged(function(u){
      stop();
      if(u){ firebaseOK = true; ecouterConfig(); }
      else connexionAnonyme().catch(function(e){ etatSync = "hors-ligne"; console.warn(e); majStatutPJ(); });
    });
  }
  function estCompteParent(){
    var u = firebaseOK && firebase.auth().currentUser;
    return !!(u && !u.isAnonymous);
  }

  /* ---------- Message bref ---------- */
  var minuteurToast = null;
  function toast(t){
    var z = $("toast-hub"); z.textContent = t; z.style.display = "block";
    clearTimeout(minuteurToast); minuteurToast = setTimeout(function(){ z.style.display = "none"; }, 3500);
  }

  /* ---------- Fenêtre « Joueurs et jeux » (Mode Parent) ---------- */
  var brouillon = null, fondPJ = null, connexionVisible = false;
  function ouvrirPJ(){
    if(!window.HubParent || !window.HubParent.actif()) return;   /* réservé au Mode Parent déverrouillé */
    brouillon = JSON.parse(JSON.stringify({ joueurs: config.joueurs, attributions: config.attributions }));
    connexionVisible = false;
    if(!fondPJ){
      fondPJ = document.createElement("div"); fondPJ.className = "pj-fond";
      fondPJ.setAttribute("role", "dialog"); fondPJ.setAttribute("aria-modal", "true"); fondPJ.setAttribute("aria-label", "Joueurs et jeux");
      fondPJ.addEventListener("click", clicPJ);
      fondPJ.addEventListener("input", saisiePJ);
      document.body.appendChild(fondPJ);
    }
    fondPJ.hidden = false;
    rendrePJ();
  }
  function fermerPJ(){ if(fondPJ) fondPJ.hidden = true; brouillon = null; }
  function texteStatut(){
    if(etatSync === "en-ligne") return "🟢 En ligne : le réglage sera partagé avec tous les appareils.";
    if(etatSync === "refus-lecture") return "🟠 Firebase refuse l'accès au réglage : la règle « hub » n'est pas encore installée. Le réglage restera sur cet appareil.";
    if(etatSync === "hors-ligne") return "🔴 Hors connexion : le réglage sera enregistré sur cet appareil seulement.";
    return "⚪ Mode local (fichier ouvert sur l'appareil) : le réglage reste sur cet appareil.";
  }
  function majStatutPJ(){ var s = document.getElementById("pj-statut"); if(s) s.textContent = texteStatut(); }
  function rendrePJ(){
    var h = "<div class=\"pj-boite\">";
    h += "<h2>👥 Joueurs et jeux</h2>";
    h += "<p class=\"pj-aide\">Crée un joueur par enfant, puis touche les prénoms pour choisir qui voit chaque jeu. Un jeu jamais réglé reste visible par tous.</p>";
    h += "<h3>1. Les joueurs</h3>";
    if(!brouillon.joueurs.length) h += "<p class=\"pj-aide\">Aucun joueur : tout le monde voit tous les jeux, sans écran « Qui joue ? ».</p>";
    brouillon.joueurs.forEach(function(j, i){
      h += "<div class=\"pj-ligne\"><input class=\"pj-emoji\" data-i=\"" + i + "\" data-champ=\"emoji\" maxlength=\"4\" aria-label=\"Emoji du joueur\" value=\"" + esc(j.emoji) + "\">" +
        "<input class=\"pj-nom\" data-i=\"" + i + "\" data-champ=\"nom\" maxlength=\"20\" placeholder=\"Prénom ou pseudo\" aria-label=\"Prénom du joueur\" value=\"" + esc(j.nom) + "\">" +
        "<button type=\"button\" class=\"bouton rouge\" data-pj=\"supprimer\" data-i=\"" + i + "\">Supprimer</button></div>";
    });
    h += "<button type=\"button\" class=\"bouton clair\" data-pj=\"ajouter\">➕ Ajouter un joueur</button>";
    h += "<h3>2. Les jeux de chacun</h3>";
    if(!brouillon.joueurs.length){ h += "<p class=\"pj-aide\">Ajoute d'abord un joueur.</p>"; }
    else {
      SECTIONS.forEach(function(s){
        TOOLS.filter(function(t){ return t.sec === s.id && t.esp === s.esp; }).forEach(function(t){
          var a = attributionDe(brouillon, t.href);
          h += "<div class=\"pj-jeu\"><div class=\"pj-jeu-titre\">" + esc(t.emoji + " " + t.titre) + (a ? "" : " <small>(pas encore réglé : visible par tous)</small>") + "</div><div class=\"pj-puces\">";
          brouillon.joueurs.forEach(function(j){
            var on = !a || a.joueurs.indexOf(j.id) >= 0;
            h += "<button type=\"button\" class=\"pj-puce" + (on ? " on" : "") + "\" aria-pressed=\"" + on + "\" data-pj=\"basculer\" data-href=\"" + esc(t.href) + "\" data-id=\"" + esc(j.id) + "\">" +
              (on ? "✅ " : "⬜ ") + esc((j.emoji || "") + " " + (j.nom || "…")) + "</button>";
          });
          h += "</div></div>";
        });
      });
    }
    h += "<p class=\"pj-statut\" id=\"pj-statut\">" + esc(texteStatut()) + "</p>";
    h += "<div class=\"pj-connexion\" id=\"pj-connexion\"" + (connexionVisible ? "" : " hidden") + ">" +
      "<p class=\"pj-aide\"><b>Connexion du compte parent</b> (le même que pour Quiz Math Foot) pour enregistrer en ligne :</p>" +
      "<input type=\"email\" id=\"pj-email\" placeholder=\"parent@exemple.fr\" autocomplete=\"username\">" +
      "<div class=\"pj-mdp\"><input type=\"password\" id=\"pj-mdp\" placeholder=\"Mot de passe\" autocomplete=\"current-password\">" +
      "<button type=\"button\" class=\"pj-oeil\" data-pj=\"oeil\" aria-label=\"Afficher ou masquer le mot de passe\">👁️</button></div></div>";
    h += "<div class=\"pj-erreur\" id=\"pj-erreur\" role=\"alert\"></div>";

  function saisiePJ(e){
    var c = e.target.getAttribute("data-champ");
    if(!c || !brouillon) return;
    var i = Number(e.target.getAttribute("data-i"));
    if(brouillon.joueurs[i]) brouillon.joueurs[i][c] = e.target.value;
  }
  function clicPJ(e){
    var b = e.target.closest ? e.target.closest("[data-pj]") : null;
    if(!b || !brouillon) return;
    var action = b.getAttribute("data-pj");
    if(action === "fermer"){ fermerPJ(); return; }
    if(action === "oeil"){ var m = $("pj-mdp"); m.type = m.type === "password" ? "text" : "password"; return; }
    if(action === "ajouter"){
      brouillon.joueurs.push({ id: "j" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nom: "", emoji: "🙂" });
      rendrePJ();
      var champs = fondPJ.querySelectorAll(".pj-nom"); if(champs.length) champs[champs.length - 1].focus();
      return;
    }
    if(action === "supprimer"){
      var i = Number(b.getAttribute("data-i")), id = brouillon.joueurs[i].id;
      brouillon.joueurs.splice(i, 1);
      brouillon.attributions.forEach(function(a){ a.joueurs = a.joueurs.filter(function(x){ return x !== id; }); });
      rendrePJ(); return;
    }
    if(action === "basculer"){
      var href = b.getAttribute("data-href"), jid = b.getAttribute("data-id");
      var a = attributionDe(brouillon, href);
      if(!a){   /* 1er réglage de ce jeu : on part de « visible par tous » */
        a = { href: href, joueurs: brouillon.joueurs.map(function(j){ return j.id; }) };
        brouillon.attributions.push(a);
      }
      var k = a.joueurs.indexOf(jid);
      if(k >= 0) a.joueurs.splice(k, 1); else a.joueurs.push(jid);
      rendrePJ(); return;
    }
    if(action === "enregistrer") enregistrerPJ();
  }
  function enregistrerPJ(){
    var err = $("pj-erreur"); err.textContent = "";
    var noms = {}, probleme = "";
    brouillon.joueurs.forEach(function(j){
      j.nom = String(j.nom || "").trim(); j.emoji = String(j.emoji || "").trim() || "🙂";
      if(!j.nom) probleme = "Chaque joueur doit avoir un prénom ou un pseudo.";
      else if(noms[j.nom.toLowerCase()]) probleme = "Deux joueurs ont le même nom : « " + j.nom + " ».";
      noms[j.nom.toLowerCase()] = true;
    });
    if(probleme){ err.textContent = probleme; return; }
    var ids = brouillon.joueurs.map(function(j){ return j.id; });
    brouillon.attributions.forEach(function(a){ a.joueurs = a.joueurs.filter(function(x){ return ids.indexOf(x) >= 0; }); });
    var aEcrire = { joueurs: brouillon.joueurs, attributions: brouillon.attributions, maj: Date.now() };

    var garderLocal = function(message){
      config = normaliser(aEcrire); config.nonSync = true;
      ecrire(CLE_CONFIG, config); fermerPJ(); afficherSelonJoueur(); majParent(); toast(message);
    };
    if(!firebaseOK){ garderLocal("💾 Enregistré sur cet appareil (pas de connexion à Firebase)."); return; }

    var envoyer = function(){
      return db.collection("hub").doc("joueurs").set(aEcrire).then(function(){
        config = normaliser(aEcrire); ecrire(CLE_CONFIG, config);
        fermerPJ(); afficherSelonJoueur(); majParent(); toast("✅ Enregistré pour tous les appareils.");
      });
    };
    var echec = function(e){
      console.warn("Écriture hub/joueurs impossible.", e);
      if(e && e.code === "permission-denied") garderLocal("⚠️ Firebase a refusé l'écriture (règle « hub » manquante ou mauvais compte). Enregistré sur cet appareil seulement.");
      else garderLocal("⚠️ Envoi impossible. Enregistré sur cet appareil seulement.");
    };
    /* Repasse l'appareil en session anonyme : un enfant ne doit jamais hériter de la session parent
       (sinon le Mode Parent de Quiz Math Foot, sur le même site, s'ouvrirait sans mot de passe). */
    var revenirAnonyme = function(){
      return firebase.auth().signOut().then(connexionAnonyme).catch(function(e){ console.warn(e); });
    };

    if(estCompteParent()){ envoyer().catch(echec); return; }
    if(!connexionVisible){
      connexionVisible = true; rendrePJ();
      $("pj-erreur").textContent = "Connecte-toi avec le compte parent pour enregistrer en ligne.";
      $("pj-email").focus();
      return;
    }
    var email = $("pj-email").value.trim(), mdp = $("pj-mdp").value;
    if(!email || !mdp){ err.textContent = "Renseigne l'email et le mot de passe du compte parent."; return; }
    err.textContent = "Connexion…";
    firebase.auth().signInWithEmailAndPassword(email, mdp).then(function(){
      return envoyer().catch(echec).then(revenirAnonyme);
    }).catch(function(e){
      var code = e && e.code;
      err.textContent = (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found")
        ? "Email ou mot de passe incorrect." : "Connexion impossible (" + code + ").";
    });
  }

  /* ===================== DÉMARRAGE ===================== */
  afficherSelonJoueur();
  demarrerFirebase();
  window.addEventListener("load", majParent);
  document.addEventListener("hub:parent", majParent);
  window.addEventListener("pageshow", function(e){ if(e.persisted){ afficherSelonJoueur(); } });
})();
</script>
<!-- hub-commun v1.0 : bouton Mes jeux + Mode Parent partage -->
<script src="hub-commun.js"></script>
